<!doctype html>
<!--
================================================================================
 IMPERMEABLE MATERIALS ON R1-1 LOTS  --  the map
================================================================================

WHAT THIS PAGE DOES
  Two lines of Vancouver's R1-1 District Schedule, applied to every ordinary
  R1-1 lot in the city, using the City's own parcel polygons and its 2015
  building footprints:
      s.3.2.2.7  Maximum site coverage for all buildings    50% of the site area
      s.3.2.2.8  Maximum area of impermeable materials      75% of the site area
  and s.4.2.2: the 75% includes the buildings. Section 2 says what counts:
  permeable pavers count as impermeable; wood decking is permeable only with
  spaced boards, on grade, with nothing under it.

  For ONE LOT (click it, or type its address): the roof area the City mapped,
  what that is to the walls once the eave is taken off, how it stands against
  50%, and how much room s.3.2.2.8 leaves for driveways, walks, patios and
  decks. Then a short schedule of what else is on the lot, classified in the
  by-law's words, tested against 75%.

  For THE CITY (the slider): set the same impermeable share on every lot,
  from an empty lot at 0% to 100%. Each house appears once its 2015 roofs fit
  within that share; the 75% mark on the track is the by-law maximum, and past
  it every lot's extra share is drawn as a purple stripe.

  The storm card is NOT the by-law. It is a Rain City Strategy water balance
  (a Council policy), kept as context, with its assumptions written beside it.

HOW THE PANEL IS LAID OUT
  Two modes under one switch: "One lot" (search, the lot's bar, its verdict,
  its paving schedule) and "Every lot" (the slider and the count). The by-law
  passages open in place from the small blue references, and all of them,
  with the notes and sources, sit behind "The by-law, verbatim" at the end.
  The legend sits on the map. On a phone the panel is a bottom sheet with a
  one-line "peek" row.

HOW TO OPEN IT
  It needs a small local web server (a browser will not load the data files
  from disk). In a terminal, from the project folder:
      cd map
      python3 -m http.server
  then open  http://localhost:8000  in a browser. The published copy is at
  https://kevinjinn6.github.io/arch540-impermeable-materials/

TO CHANGE THE NUMBERS
  Everything is in the CONFIGURATION block inside the <script> below. Every
  number the page prints is built from those constants; change a constant and
  every sentence follows.

WHERE THE DATA COMES FROM
  data/lots.geojson        one feature per zoning site (buildings.py):
                           k key, ad address, A site area m2, r roof area m2
                           (2015 footprints clipped to the site, to the ROOF
                           EDGE), sc scope (0 ordinary, 1 large site, 2 not a
                           lot), m merged site, f shared address not adjoining,
                           cd check data. If the pipeline has written rw (roof
                           area to the walls) it is used directly.
  data/roof-walls.json     otherwise, rw per site: the same footprints shrunk
                           inwards by the eave allowance before clipping.
  data/buildings.geojson   the 2015 footprints, drawn at street zoom.
  data/parks.geojson       City park outlines ("Parks - polygon
                           representation", open data, 2026-09-28), drawn
                           green under the lots: n name, c class, ha area.
                           Urban plazas (paved) are left out.
  data/gardens.geojson     community gardens ("Community gardens and food
                           trees", 2026-07-14): n name, pl plots. Sites with
                           food trees only are left out.
  data/catch-basins.geojson  the City's street catch basins ("Sewer catch
                           basins", 2026-10-05; locations approximate), one
                           MultiPoint, drawn from street zoom in.
================================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impermeable materials on R1-1 lots</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<!-- The typeface: Geist, with Geist Mono for the figures. If it can't load, the system font takes over. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<!-- earcut cuts each lot outline into triangles, which is what the graphics card draws. -->
<script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
<style>
  /* Colours. Purple means "over the 75% cap" everywhere: on the map, on the lot's bar, on the
     slider and on the FAIL pill. Red only ever means "impermeable material". The purple is a
     dark violet on the light theme and a lavender on the dark one, so it differs from red and
     blue in lightness as well as hue (hue alone is lost on red-blind viewers). */
  :root {
    --surface: #fbfaf7; --ink: #1c1b18; --ink-2: #54524c; --ink-3: #65635c;
    --rule: #e4e1da; --fill: #efede8; --accent: #2a6fc4;
    --float: 0 0 0 1px rgba(28,27,24,.06), 0 2px 4px rgba(28,27,24,.04), 0 12px 32px -8px rgba(28,27,24,.16);
    --glass: color-mix(in srgb, var(--surface) 92%, transparent);
    --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --permeable: #287bc1; --impermeable: #d94a48; --over: #581c87; --check: #ffbf00; --check-ink: #b45309; --out: #b9b8b2;
    --roof: #3d3d3a;
    --pass: #2f7d4f; --fail: #581c87; --on-pill: #fff;
    --row: 44px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #1b1a18; --ink: #f2f0eb; --ink-2: #bab7b0; --ink-3: #9c9991;
      --rule: #34322e; --fill: #272522; --accent: #5b9cec;
      --float: 0 0 0 1px rgba(255,255,255,.07), 0 12px 32px -8px rgba(0,0,0,.6); --over: #d8b4fe; --check-ink: #ffbf47; --out: #5a5955;
      --roof: #6b6a65; --pass: #5fbf85; --fail: #d8b4fe; --on-pill: #1f1f1d;
    }
  }
  :root[data-theme="dark"] {
    --surface: #1b1a18; --ink: #f2f0eb; --ink-2: #bab7b0; --ink-3: #9c9991;
    --rule: #34322e; --fill: #272522; --accent: #5b9cec;
    --float: 0 0 0 1px rgba(255,255,255,.07), 0 12px 32px -8px rgba(0,0,0,.6); --over: #d8b4fe; --check-ink: #ffbf47; --out: #5a5955;
    --roof: #6b6a65; --pass: #5fbf85; --fail: #d8b4fe; --on-pill: #1f1f1d;
  }
  html, body { margin: 0; height: 100%; background: var(--surface); color: var(--ink);
    font: 14px/20px var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: "ss01"; }
  ::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
  #map { position: absolute; inset: 0; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-2);
    pointer-events: none; text-align: center; padding: 20px; }

  /* ---- The panel: a fixed head (title, mode switch) over a scrolling body ---- */
  #panel {
    position: absolute; top: 12px; left: 12px; width: 372px; max-height: calc(100% - 24px);
    box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
    background: color-mix(in srgb, var(--surface) 97%, transparent); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border: 0; border-radius: 16px; box-shadow: var(--float); z-index: 3;
  }
  .progress { position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--fill); overflow: hidden; }
  .progress span { display: block; width: 40%; height: 100%; background: var(--accent); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
  .handle, .peek { display: none; }
  .head { flex: none; padding: 22px 20px 4px; }
  .body { flex: 1 1 auto; overflow-y: auto; padding: 0 20px 20px; }

  /* Type: four sizes. Display 28, Title 17, Body 14, Caption 12. Nothing smaller. */
  h1 { font-size: 20px; line-height: 24px; font-weight: 600; letter-spacing: -.02em; margin: 0; }
  h2 { margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
  .sub { font-size: 12px; line-height: 16px; color: var(--ink-2); margin: 4px 0 0; text-wrap: pretty; }
  .caption { font-size: 12px; line-height: 16px; color: var(--ink-2); }
  .display { font-size: 30px; line-height: 34px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .pass { color: var(--pass); } .fail { color: var(--fail); } .check { color: var(--check-ink); } .over { color: var(--over); }
  .pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px;
    font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--on-pill); background: var(--ink-3); white-space: nowrap; }
  .pill.pass { background: var(--pass); } .pill.fail { background: var(--fail); } .pill.check { background: var(--check-ink); }
  .pill.out { background: var(--out); color: var(--ink); }

  /* Segmented controls: the mode switch and the material switch */
  .seg { display: flex; gap: 2px; padding: 2px; background: var(--fill); border-radius: 10px; box-sizing: border-box; }
  .seg button { flex: 1 1 0; min-width: 0; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2);
    font: inherit; font-weight: 500; cursor: pointer; padding: 0 4px; }
  .seg button[aria-selected="true"], .seg button[aria-checked="true"] { background: var(--surface); color: var(--ink);
    font-weight: 600; box-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.10); }
  .seg button { transition: background .15s, color .15s; }
  .seg button:not([aria-selected="true"]):hover { color: var(--ink); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #modes { margin-top: 16px; height: 36px; }

  /* The selected lot, carried into Every-lot mode as one line */
  .chip-row { display: none; justify-content: space-between; align-items: center; gap: 12px; height: var(--row); margin-top: 4px; }
  #panel[data-mode="city"] .chip-row { display: flex; }
  .chip-row .dotink { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); flex: none; }
  .chip-row .txt { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linkbtn { border: 0; background: transparent; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-align: left; white-space: nowrap; }
  #panel[data-mode="city"] #modeLot, #panel[data-mode="lot"] #modeCity { display: none; }

  /* Search */
  .search { display: flex; align-items: center; gap: 8px; height: var(--row); margin-top: 12px; padding: 0 12px; background: var(--fill); border-radius: 10px; box-sizing: border-box; box-shadow: inset 0 0 0 1px transparent; transition: box-shadow .15s, background .15s; }
  .search:focus-within { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .search svg { flex: none; color: var(--ink-2); }
  .search input { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font: inherit; color: var(--ink); outline: none; }
  .search input::placeholder { color: var(--ink-3); }
  .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
  .search button { flex: none; border: 0; background: transparent; padding: 0; width: 24px; height: 24px; display: inline-flex;
    align-items: center; justify-content: center; cursor: pointer; color: var(--ink-3); }
  #addrError { margin: 6px 2px 0; }
  .hair { height: 1px; background: var(--rule); margin: 16px 0; }

  /* The lot card */
  .lot-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .addr { font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: -.01em; }
  .areabar { position: relative; display: flex; height: 16px; border-radius: 5px; background: var(--rule); margin: 14px 0 30px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }
  .areabar span { height: 100%; transition: width 250ms ease-out; }
  .areabar span:first-child { border-radius: 5px 0 0 5px; }
  #barRoof { background: var(--roof); } #barRed { background: var(--impermeable); } #barOver { background: var(--over); } #barBlue { background: var(--permeable); }
  .areabar.out { background: var(--out); margin-bottom: 16px; }
  .areabar .mark { position: absolute; top: -3px; width: 1.5px; height: 22px; background: var(--ink); border-radius: 1px; }
  .areabar .mark i, .areabar .ghost i { position: absolute; top: 22px; left: 0; transform: translateX(-50%); font-style: normal;
    font-size: 12px; line-height: 16px; color: var(--ink-2); white-space: nowrap; }
  .areabar .ghost { position: absolute; top: -2px; width: 0; height: 18px; border-left: 1px dashed var(--ink-3); }
  .areabar .ghost i { top: 38px; color: var(--ink-3); }
  .areabar .mark i { font-family: var(--mono); font-size: 11px; }
  .areabar.ghosted { margin-bottom: 50px; }
  .verdict { display: flex; align-items: center; gap: 10px; min-height: 32px; }
  .facts { display: flex; flex-direction: column; margin-top: 16px; }
  .fact { padding: 8px 0; }
  .fact-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 28px; }
  .fact-row .num { display: inline-flex; align-items: center; gap: 10px; }
  .total { margin-top: 8px; min-height: 36px; }
  .sec { display: flex; justify-content: space-between; align-items: baseline; margin-top: 20px; }
  .empty { margin: 0; color: var(--ink-2); }
  .skel { display: flex; flex-direction: column; gap: 12px; }
  .skel span { display: block; height: 14px; border-radius: 6px; background: var(--fill); }

  /* Disclosures: a reference chip opens its passage in place; a row opens its contents */
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .chev { flex: none; width: 16px; height: 16px; color: var(--ink-3); transition: transform .15s; }
  details[open] > summary .chev { transform: rotate(90deg); }
  .chevd { flex: none; width: 12px; height: 12px; transition: transform .15s; }
  details[open] > summary .chevd { transform: rotate(180deg); }
  .chip { color: var(--accent); display: inline-flex; align-items: center; gap: 2px; font-size: 12px; line-height: 16px; white-space: nowrap; }
  .ref { margin-top: 4px; }
  .passage { margin: 6px 0 4px 2px; padding-left: 10px; border-left: 2px solid var(--rule); font-size: 12px; line-height: 16px; color: var(--ink-2); }
  .passage .src { color: var(--ink-3); }
  .rows { display: flex; flex-direction: column; margin-top: 12px; }
  .row { border-top: 1px solid var(--rule); }
  .rows > :last-child { border-bottom: 1px solid var(--rule); }
  .row > summary, .linkrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: var(--row); font: inherit; color: var(--ink); }
  .row > summary .two { display: flex; flex-direction: column; padding: 6px 0; }
  .linkrow { width: 100%; border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; }
  .row > summary:hover .chev, #bylaw > summary:hover .chev { color: var(--ink); }
  .chip:hover { text-decoration: underline; text-underline-offset: 2px; }
  .pad { padding: 0 0 12px; }
  .hand { display: grid; grid-template-columns: auto auto 1fr; gap: 2px 12px; font-size: 12px; line-height: 16px; color: var(--ink-2);
    font-variant-numeric: tabular-nums; padding: 0 0 12px; }
  .hand b { text-align: right; color: var(--ink); font-weight: 600; }

  /* The paving schedule: one row per surface */
  .sched { list-style: none; margin: 8px 0 0; padding: 0; }
  .srow { display: flex; flex-direction: column; gap: 4px; padding: 8px 0; border-top: 1px solid var(--rule); }
  .srow:last-child { border-bottom: 1px solid var(--rule); }
  .srow-top, .srow-bot { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .srow-bot { flex-wrap: wrap; }
  .amt { display: inline-flex; align-items: center; gap: 6px; flex: none; }
  .amt input { width: 64px; height: 36px; border: 0; border-radius: 8px; background: var(--fill); text-align: right; padding: 0 8px;
    font: inherit; color: var(--ink); font-variant-numeric: tabular-nums; }
  .amt input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* 44 px to the finger, with the icon kept at the row's right edge and clear of the number */
  .rm { border: 0; background: transparent; padding: 0; width: 44px; height: 44px; margin: -4px -13px -4px 4px; display: inline-flex;
    align-items: center; justify-content: center; color: var(--ink-3); cursor: pointer; }
  .rm:hover { color: var(--fail); }
  /* The surface's name: plain text until touched */
  .lbl { flex: 1 1 0; min-width: 0; height: 36px; margin-left: -6px; padding: 0 6px; border: 0; border-radius: 8px; background: transparent;
    font: inherit; color: var(--ink); box-shadow: inset 0 -1px 0 var(--rule); text-overflow: ellipsis; }
  .lbl::placeholder { color: var(--ink-3); }
  .lbl:hover { background: var(--fill); }
  .lbl:focus { background: var(--fill); box-shadow: none; outline: 2px solid var(--accent); outline-offset: 1px; }
  .undo { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: var(--row); margin-top: 8px;
    padding: 0 12px; border-radius: 10px; background: var(--fill); }
  .undo span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sec .linkbtn.caption { color: var(--accent); }
  .sel { display: inline-flex; align-items: center; gap: 2px; flex: 1 1 0; min-width: 0; }   /* basis 0, so it shrinks before the row wraps */
  .sel select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; padding: 0; font: inherit; color: var(--ink);
    width: 100%; min-width: 0; cursor: pointer; text-overflow: ellipsis; }
  .sel .chevd { color: var(--ink-3); }
  .cls { flex: none; margin-left: auto; }
  .cls > summary { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .cls[open] { flex: 1 0 100%; display: flex; flex-direction: column; align-items: flex-end; }
  .cls .why { align-self: stretch; margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--rule); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; box-sizing: border-box; flex: none; }
  .dot.imp { background: var(--impermeable); } .dot.perm { border: 2px solid var(--permeable); }

  /* Every lot */
  #cityHero { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  #cityHero .display { font-size: 40px; line-height: 44px; }
  .added { display: flex; align-items: baseline; gap: 8px; margin-top: 20px; }
  .added b { font-size: 20px; line-height: 24px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .track { position: relative; margin-top: 8px; padding-top: 20px; }
  input[type=range] { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 4px; margin: 10px 0;
    border-radius: 2px; background: var(--rule); outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface); border: 0; box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.18), 0 0 0 6px color-mix(in srgb, var(--accent) 0%, transparent); transition: box-shadow .15s; box-sizing: border-box; }
  input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface); border: 0; box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.18), 0 0 0 6px color-mix(in srgb, var(--accent) 0%, transparent); transition: box-shadow .15s; box-sizing: border-box; }
  input[type=range]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=range]:active::-webkit-slider-thumb { box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.18), 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent); }
  input[type=range]:disabled { cursor: default; opacity: .6; }
  /* The tick is the selected lot's room: the track is blue up to it and purple past it. Its label sits above the track. */
  .tick { position: absolute; top: 24px; width: 2px; height: 16px; background: var(--over); transform: translateX(-1px); border-radius: 1px; }
  .tick span { position: absolute; bottom: 100%; margin-bottom: 6px; font-size: 12px; line-height: 16px; color: var(--over); white-space: nowrap; }
  .tick.l span { left: 0; } .tick.c span { left: 0; transform: translateX(-50%); } .tick.r span { right: 0; }
  .stops { position: relative; display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .stops .limit { position: absolute; top: 0; transform: translateX(-50%); color: var(--ink); white-space: nowrap; }
  /* The by-law maximum on the track: past it, every lot's extra share is a purple stripe. */
  .limit-mark { position: absolute; top: 26px; width: 2px; height: 12px; background: var(--ink); transform: translateX(-1px); border-radius: 1px; pointer-events: none; }
  #cityHint { margin: 8px 0 0; }
  .tag { display: inline-block; font-size: 12px; line-height: 16px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--ink-3); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; margin-bottom: 6px; }
  .water-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--rule); margin: 6px 0 4px; }
  .water-bar span { height: 100%; }

  /* The by-law, verbatim: every passage, the notes and the sources, behind one row */
  #bylaw { margin-top: 12px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .sheet { padding: 4px 0 12px; display: flex; flex-direction: column; gap: 12px; font-size: 12px; line-height: 16px; color: var(--ink-2); }
  .sheet .rule b { display: block; color: var(--ink); }
  .sheet .q { margin-top: 4px; }
  .sheet .q b { color: var(--ink); }
  .sheet .src { color: var(--ink-3); }
  .notes { margin: 0; padding-left: 16px; } .notes li { margin-bottom: 4px; }
  footer { border-top: 1px solid var(--rule); padding-top: 8px; color: var(--ink-3); }

  /* The legend, on the map, next to the colours it explains */
  .legend { position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: 372px; box-sizing: border-box;
    padding: 10px 14px; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);

  .legend div { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 4px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .swatch.outline { box-sizing: border-box; border: 2px solid var(--check); outline: 1px solid var(--ink); background: transparent !important; }

  .legend .small { flex-basis: 100%; color: var(--ink-3); }
  .mapbtn { position: absolute; right: 12px; bottom: 12px; width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: var(--ink); font: italic 600 17px/1 Georgia, "Times New Roman", serif;
    box-shadow: var(--float); cursor: pointer; display: none; }
  .maplibregl-ctrl-top-right { top: 4px; right: 4px; }
  .maplibregl-ctrl-group { background: var(--glass) !important; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-radius: 12px !important; box-shadow: var(--float) !important; overflow: hidden; }
  .maplibregl-ctrl-group button { width: 36px; height: 36px; }

  .maplibregl-ctrl-group button:hover { background: var(--fill) !important; }
  :root[data-theme="dark"] .maplibregl-ctrl-icon { filter: invert(1); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .maplibregl-ctrl-icon { filter: invert(1); } }
  .maplibregl-ctrl button.city-ctrl { font: 600 11px/1 var(--sans); color: var(--ink); letter-spacing: .01em; }
  .maplibregl-ctrl-attrib { font: 11px/16px var(--sans); }

  /* Phone: the panel is a bottom sheet with a one-line peek and a full height */
  @media (max-width: 560px) {
    #panel { top: auto; bottom: 0; left: 0; width: 100%; max-height: none; height: 96px; border-radius: 20px 20px 0 0; border-bottom: 0;
      transition: height .25s ease; }

</style>

<script>
// =============================================================================
//  CONFIGURATION  --  change these numbers, not the code below
// =============================================================================

// ---- The by-law --------------------------------------------------------------
const BYLAW = {
  name: "Zoning and Development By-law No. 3575, R1-1 District Schedule",
  consolidation: "June 2026",
  building_limit: 0.50,      // s.3.2.2.7  maximum site coverage for all buildings
  impermeable_limit: 0.75,   // s.3.2.2.8  maximum area of impermeable materials
  min_site_area_m2: 306,     // s.3.2.2.1  minimum site area, single detached house / duplex
  schedule_url: "https://bylaws.vancouver.ca/zoning/zoning-by-law-district-schedule-r1-1.pdf",
  section2_url: "https://bylaws.vancouver.ca/zoning/zoning-by-law-section-2.pdf",
  repo_url: "https://github.com/kevinjinn6/arch540-impermeable-materials",
};
// The passages, word for word, with their pages in the June 2026 PDFs.
const PASSAGES = {
  s3227: { ref: "s.3.2.2.7, p.12", text: "Maximum site coverage for all buildings — 50% of the site area" },
  s3228: { ref: "s.3.2.2.8, p.12", text: "Maximum area of impermeable materials — 75% of the site area" },
  s422:  { ref: "s.4.2.2, p.16",   text: "The maximum area of impermeable materials includes site coverage for all buildings." },
  imp:   { ref: "Section 2, “Impermeable Materials”, p.20",
           text: "The projected area of the outside of the outermost walls of all buildings, including carports, entries, porches and verandahs, asphalt, concrete, brick, stone, permeable pavers, and wood." },
  perm:  { ref: "Section 2, “Permeable Materials”, p.31",
           text: "Materials including gravel, river rock less than 5 cm in size, wood chips, bark mulch, wood decking with spaced boards and other materials which, in the opinion of the Director of Planning, have fully permeable characteristics when placed or installed on grade with no associated layer of impermeable material, such as plastic sheeting, that would impede the movement of water directly to the soil." },
  site:  { ref: "Section 2, “Site”, p.43", text: "An area of land consisting of 1 or more adjoining parcels or lots abutting on a street not being a lane, but does not include a strata lot …" },
};

// ---- Materials, in the by-law's words ----------------------------------------
// counts = true  -> impermeable under s.3.2.2.8.   The passage each rests on.
const MATERIALS = [
  { id: "concrete",  name: "concrete or asphalt",                       counts: true,  why: "named in “Impermeable Materials” (p.20)" },
  { id: "pavers",    name: "permeable pavers",                          counts: true,  why: "named in “Impermeable Materials” (p.20), despite the name; Council added them by By-law 13670 (26 April 2023) because, in the City's words, “most permeable pavers lose their permeability over time”" },
  { id: "brick",     name: "brick or stone",                            counts: true,  why: "named in “Impermeable Materials” (p.20)" },
  { id: "deck",      name: "wood decking, tight boards or raised",      counts: true,  why: "“wood” is named impermeable (p.20); only spaced boards on grade escape (p.31); a Deck is over 600 mm, so not on grade (p.11)" },
  { id: "building",  name: "building, porch, carport or garage",        counts: true,  why: "“outermost walls of all buildings, including carports, entries, porches and verandahs” (p.20)" },
  { id: "spaced",    name: "wood decking, spaced boards, on grade",     counts: false, why: "“wood decking with spaced boards … on grade with no associated layer of impermeable material” (p.31)" },
  { id: "gravel",    name: "gravel or river rock under 5 cm",           counts: false, why: "named in “Permeable Materials” (p.31), on grade with nothing under it" },
  { id: "mulch",     name: "wood chips or bark mulch",                  counts: false, why: "named in “Permeable Materials” (p.31)" },
  { id: "lawn",      name: "lawn or planting",                          counts: false, why: "ground, not a material; nothing in s.3.2.2.8 counts it" },
];
// The three choices offered for the citywide slider, by id above, and the short names on the switch.
// The citywide slider: the impermeable share of every lot, 0% (an empty lot)
// to the by-law maximum of 75%. A lot's house appears once the slider reaches
// its roof share (to the walls).
// Typical hard landscaping, used to prefill a lot's schedule. Edit on the page.
const DEFAULT_SCHEDULE = [
  { label: "Driveway and parking pad", id: "pavers",   m2: 45 },
  { label: "Walks and patio",          id: "concrete", m2: 25 },
  { label: "Deck",                     id: "deck",     m2: 12 },
];

// ---- Measurement ---------------------------------------------------------------
const EAVE_M = 0.45;
// The 2015 footprints follow the ROOF EDGE; the by-law measures a building to
// "the outside of the outermost walls". A Vancouver house roof overhangs by
// about 0.3–0.6 m. Roof areas are shown both ways; the by-law test uses the
// wall estimate, computed by shrinking every footprint inwards by this much
// before clipping it to the site (buildings.py EAVE_M, or data/roof-walls.json).
const NOT_A_SITE_M2 = 150;
// Parcels smaller than this, or flagged by the pipeline (cd: roof over 90%;
// f: shared address, not adjoining), are drawn grey and not assessed: they are
// usually strata remnants or data faults, not sites.

// ---- Rainfall and soil (the storm card; NOT the by-law) ----------------------
const STORM = {
  policy: "Rain City Strategy (2019), a Council policy",
  rainfall_mm: 48,     // the Strategy's daily design standard
  runoff: 0.85,        // share of rain that runs off hard surfaces (this page's assumption)
  soil_mm: 75,         // mm of water the permeable ground holds (good soil; this page's assumption)
  pool_m3: 2500,       // one Olympic pool, for scale
};

// ---- Colours for the lots (CSS variables above hold the panel's) ------------
// blue = permeable, red = impermeable (growing from the south edge of each lot, as a diagram),
// purple = the lot is over the 75% cap at this setting, amber = roof alone over 50% even to the walls: check.
// The purple is a dark violet on the light basemap and a lavender on the dark one, so that it
// differs from red and from blue in lightness, not only in hue. Keep these equal to --over above.
const COLOR = { permeable: "#287bc1", impermeable: "#d94a48", over: "#581c87", overDark: "#d8b4fe", check: "#ffbf00",
                out: "#b9b8b2", roof: "#3d3d3a", roofDark: "#6b6a65", park: "#3f9a4a", parkDark: "#4f9a5a",
                garden: "#c3e88d", gardenEdge: "#1d4d24", basin: "#17212b", basinDark: "#e8eef5" };
const BASINS_MIN_ZOOM = 15;           // catch basins are drawn from this zoom in
const LOT_OPACITY = 0.82;
const BUILDINGS_MIN_ZOOM = 14;        // footprints are fetched and drawn from this zoom in

// ---- Where the map opens ---------------------------------------------------------
const OPEN_ADDRESS = "3528 W 30TH AV";          // the README's example lot; "" for none
const OPEN_AT = { center: [-123.17805, 49.24300], zoom: 17.2 };   // used when the address is not found
const FIND_ZOOM = 19;        // search, the opening lot, a check circle and "One lot" fly in to at least this: a lot about 110 px wide, its block around it
const CITY_BOUNDS = [[-123.2245, 49.1985], [-123.0236, 49.2951]];

const DATA_FILE = "data/lots.geojson";
const WALLS_FILE = "data/roof-walls.json";
const BUILDINGS_FILE = "data/buildings.geojson";
const PARKS_FILE = "data/parks.geojson";
const GARDENS_FILE = "data/gardens.geojson";
const BASINS_FILE = "data/catch-basins.geojson";
const VERSION = "2026-10-02";
// =============================================================================
//  END OF CONFIGURATION
// =============================================================================


// ---- PURE: the operation, with no map in it --------------------------------
// Everything below this line up to END PURE is plain arithmetic on a lot's
// numbers, so it can be checked by hand or run outside a browser.
const MAT = Object.fromEntries(MATERIALS.map(m => [m.id, m]));
const pct = x => `${(x * 100).toFixed(1)}%`;
const m2 = x => `${x.toLocaleString("en-CA", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} m²`;
const int = x => Math.round(x).toLocaleString("en-CA");
const roundNice = x => (x >= 1000 ? Math.round(x / 100) * 100 : Math.round(x)).toLocaleString("en-CA");

function normalise(address) {
  return String(address || "").toUpperCase().replace(/[.,]/g, " ").split(/\s+/).filter(Boolean).join(" ");
}

// How a lot stands under the two rules, with `added` m² of a material that
// counts (or not) on top of its roofs. rw is roof area to the walls.
function assess(lot, added, counts) {
  const A = lot.A, r = lot.r, rw = lot.rw;
  const cap50 = BYLAW.building_limit * A, cap75 = BYLAW.impermeable_limit * A;
  const addedCounted = counts ? added : 0;
  const impermeable = Math.min(A, rw + addedCounted);
  const room = cap75 - rw;                        // what s.3.2.2.8 leaves after the roofs
  return {
    A, r, rw, cap50, cap75,
    shareEdge: r / A, shareWall: rw / A,
    over50edge: r > cap50 + 1e-9, over50wall: rw > cap50 + 1e-9,
    room, impermeable, share: impermeable / A,
    over75: impermeable > cap75 + 1e-9,
    margin: cap75 - impermeable,
  };
}

// A schedule of surfaces for one lot: [{id, m2}] -> totals by class.
function sumSchedule(rows) {
  let imp = 0, perm = 0, pavers = 0;
  for (const row of rows) {
    const m = MAT[row.id]; const a = Math.max(0, Number(row.m2) || 0);
    if (!m) continue;
    if (m.counts) imp += a; else perm += a;
    if (row.id === "pavers") pavers += a;
  }
  return { imp, perm, pavers };
}

// Where one lot's storm goes: soaked in, over to the sewer, or left on hard
// surfaces. P rainfall, C runoff share, D soil storage; all in mm; areas in m².
function waterBalance(areaM2, hardShare) {
  const P = STORM.rainfall_mm, C = STORM.runoff, D = STORM.soil_mm;
  const hard = areaM2 * hardShare, perm = areaM2 - hard;
  const rainM3 = P * areaM2 / 1000;
  const reachingM3 = (P * perm + P * C * hard) / 1000;
  const heldM3 = Math.min(reachingM3, D * perm / 1000);
  return { rainM3, heldM3, sewerM3: reachingM3 - heldM3, surfaceM3: rainM3 - reachingM3 };
}
// ---- END PURE -----------------------------------------------------------------


// ---- Page text that depends on the configuration ---------------------------
const B = BYLAW, P50 = PASSAGES.s3227, P75 = PASSAGES.s3228, L = B.impermeable_limit;
const $ = id => document.getElementById(id);
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const OVER = dark ? COLOR.overDark : COLOR.over;          // the map's purple for this theme
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pageOf = ref => (ref.match(/p\.\d+/) || [""])[0];                      // "p.20"
const shortRef = ref => { const t = ref.split(","); return `${t[0].trim()} · ${t[t.length - 1].trim()}`; };  // "s.3.2.2.8 · p.12"
const urlOf = key => /^s\d/.test(key) ? B.schedule_url : B.section2_url;
const CHEV = `<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
const CHEVD = `<svg class="chevd" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4.5l3 3 3-3" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
// A passage, verbatim, with its page and a link to the City's PDF.
const passage = key => { const p = PASSAGES[key];
  return `<div class="passage">“${p.text}” <span class="src">${p.ref}</span> · <a href="${urlOf(key)}" target="_blank" rel="noopener">Full text ↗</a></div>`; };
// A reference chip: tap it and the passage opens under it.
const chip = label => `<span class="chip">${label} ${CHEVD}</span>`;

$("subtitle").textContent =
  `Vancouver R1-1 · buildings ≤ ${B.building_limit * 100}% · impermeable ≤ ${L * 100}%, buildings included`;
$("rule50").innerHTML =
  `<b>Buildings · ${B.building_limit * 100}% of the site</b><div class="q">“${P50.text}” <span class="src">${P50.ref}</span></div>`;
$("rule75").innerHTML =
  `<b>Impermeable materials · ${L * 100}% of the site, buildings included</b>` +
  `<div class="q">“${P75.text}” <span class="src">${P75.ref}</span></div>` +
  `<div class="q">“${PASSAGES.s422.text}” <span class="src">${PASSAGES.s422.ref}</span></div>`;
$("defsBody").innerHTML =
  `<b style="display:block;color:var(--ink)">What counts, in the by-law's words</b>` +
  `<div class="q"><b>Impermeable Materials</b> “${PASSAGES.imp.text}” <span class="src">${PASSAGES.imp.ref}</span></div>` +
  `<div class="q"><b>Permeable Materials</b> “${PASSAGES.perm.text}” <span class="src">${PASSAGES.perm.ref}</span></div>` +
  `<div class="q"><b>Site</b> “${PASSAGES.site.text}” <span class="src">${PASSAGES.site.ref}</span></div>` +
  `<div class="q">Source: <a href="${B.section2_url}" target="_blank" rel="noopener">Section 2 Definitions</a> and the ` +
  `<a href="${B.schedule_url}" target="_blank" rel="noopener">R1-1 District Schedule</a>, City of Vancouver, ${B.consolidation}. ` +
  `Copies with these page numbers are in the repository's <code>sources/</code> folder.</div>`;
const slider = $("slider");
slider.max = "100";
{ // the 75% mark, on the same scale as the thumb's centre (see updateTick)
  const at = `calc(12px + (100% - 24px) * ${BYLAW.impermeable_limit})`;
  $("limitMark").style.left = at; $("limitStop").style.left = at;
  $("limitStop").textContent = `${BYLAW.impermeable_limit * 100}% · by-law max`;
}
const sw = c => `<span class="swatch" style="background:${c}"></span>`;
$("mapLegend").innerHTML = [
  [sw(COLOR.permeable), "Permeable"],
  [sw(COLOR.impermeable), "Impermeable"],
  [sw(OVER), `Over ${L * 100}%`],
  [`<span class="swatch outline"></span>`, `Check: roof over ${B.building_limit * 100}%`],
  [`<span class="swatch picked"></span>`, "Selected lot"],
  [sw(COLOR.out), "Not assessed"],
  [sw(COLOR.park), "Park"],
  [`<span class="swatch dot" style="background:${COLOR.garden};box-shadow:inset 0 0 0 1.5px ${COLOR.gardenEdge}"></span>`, "Community garden"],
  [`<span class="swatch dot small-dot" style="background:${dark ? COLOR.basinDark : COLOR.basin}"></span>`, "Catch basin"],
].map(([w, t]) => `<div>${w}${t}</div>`).join("") +
  `<div class="small"><span id="legendNote">Split drawn as a diagram</span><span id="roofsNote" hidden></span></div>`;
$("notes").innerHTML = [
  `Roofs are the City's 2015 air-photo footprints, clipped to each site; anything built since is missing. They trace the roof edge; the by-law measures walls, so ${EAVE_M} m is taken off for the test and both figures are shown.`,
  `A site is adjoining parcels with one address (${PASSAGES.site.ref}). Sites over 2,000 m², road allowances, parcels under ${NOT_A_SITE_M2} m² and flagged parcels are grey: not assessed.`,
  `s.3.2 uses only (house, duplex). A multiplex under s.3.1 has no impermeable limit. Laneway houses (Section 11, s.2.2.4, not checked) count here as buildings.`,
  `Paving is in no City dataset: the schedule and the slider are hypotheses you set. Not a compliance finding; a reviewer measures from a survey.`,
  `At exactly ${L * 100}% a lot passes. Colours use unrounded areas.`,
  `Storm card: ${STORM.rainfall_mm} mm is the ${STORM.policy} design standard, not a by-law. Held = min[rain on permeable ground + ${Math.round(STORM.runoff * 100)}% of rain on hard surfaces, ${STORM.soil_mm} mm × permeable area]; the rest overflows.`,

// ---- Drawing the lots on the graphics card -----------------------------------
// Each lot is sent once with four numbers per corner: position, its north-south
// position within the lot, and two per-lot values the slider does not change:
//   a_roof   roof share to the walls, 0-1           a_A  site area, m²
//   a_sc     0 assessed, 1 not assessed (grey)    a_id lot number, 1 up
// u_scenario is 1 in Every-lot mode: each lot is then hard up to u_hard (the
// slider, 0-1), red up to 75% and a purple stripe for the share past 75%. In
// One-lot mode (0) each lot shows its own roofs, purple if they pass 75%;
// the selected lot (u_sel) shows its roofs plus the card's paving (u_selShare),
// red to 75% and a purple stripe past it, the same split as its bar.
const LOT_SHADER = {
  vertex: `
    precision highp float;
    attribute vec2 a_pos; attribute float a_y; attribute float a_sc; attribute float a_roof; attribute float a_A; attribute float a_id;
    uniform mat4 u_matrix;
    varying float v_y, v_sc, v_roof, v_A, v_id;
    void main() { gl_Position = u_matrix * vec4(a_pos, 0.0, 1.0); v_y = a_y; v_sc = a_sc; v_roof = a_roof; v_A = a_A; v_id = a_id; }`,
  fragment: `
    precision highp float;
    uniform float u_hard, u_scenario, u_limit, u_opacity, u_sel, u_selShare;
    uniform vec3 u_permeable, u_impermeable, u_over, u_out;
    varying float v_y, v_sc, v_roof, v_A, v_id;
    void main() {
      vec3 c;
      bool picked = u_scenario < 0.5 && u_sel > 0.5 && abs(v_id - u_sel) < 0.5;
      float hard = u_scenario > 0.5 ? u_hard : u_selShare;
      if (v_sc > 0.5) c = u_out;
      else if (u_scenario > 0.5 || picked)
        c = v_y >= 1.0 - u_limit ? (v_y >= 1.0 - hard ? u_impermeable : u_permeable)
          : (v_y >= 1.0 - hard ? u_over : u_permeable);
      else c = v_roof > u_limit + 1e-6 ? u_over : (v_y >= 1.0 - v_roof ? u_impermeable : u_permeable);
      gl_FragColor = vec4(c * u_opacity, u_opacity);
    }`,
};
const hexToRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const ORIGIN = maplibregl.MercatorCoordinate.fromLngLat([-123.12, 49.25]);
const FLOATS = 7;

function buildLotMesh(features) {
  const verts = [], idx = [];
  features.forEach((f, n) => {
    const p = f.properties;
    p._mi = n + 1;                           // the lot's number on the graphics card
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates]
                : f.geometry.type === "MultiPolygon" ? f.geometry.coordinates : [];
    let minY = Infinity, maxY = -Infinity;
    for (const rings of polys) for (const ring of rings) for (const [lng, lat] of ring) {
      const m = maplibregl.MercatorCoordinate.fromLngLat([lng, lat]);
      minY = Math.min(minY, m.y); maxY = Math.max(maxY, m.y);
    }
    const ySpan = Math.max(maxY - minY, 1e-12);
    const roof = p.assessed ? Math.min(1, p.rw / p.A) : 0;
    for (const rings of polys) {
      const flat = [], holes = [];
      rings.forEach((ring, i) => {
        if (i > 0) holes.push(flat.length / 3);
        for (const [lng, lat] of ring) {
          const m = maplibregl.MercatorCoordinate.fromLngLat([lng, lat]);
          flat.push(m.x - ORIGIN.x, m.y - ORIGIN.y, (m.y - minY) / ySpan);
        }
      });
      const base = verts.length / FLOATS, tri = [];
      for (let i = 0; i < flat.length; i += 3) {
        verts.push(flat[i], flat[i + 1], flat[i + 2], p.assessed ? 0 : 1, roof, p.A, p._mi);
        tri.push(flat[i], flat[i + 1]);
      }
      for (const k of earcut(tri, holes)) idx.push(base + k);
    }
  });
  return { verts: new Float32Array(verts), idx: new Uint32Array(idx) };
}

function lotLayer(mesh) {
  let prog, vao, loc = {}, gl2, vaoExt;
  const compile = (gl, type, src) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  return {
    id: "lots", type: "custom", renderingMode: "2d",
    onAdd(map, gl) {
      gl2 = typeof WebGL2RenderingContext !== "undefined" && gl instanceof WebGL2RenderingContext;
      if (!gl2) gl.getExtension("OES_element_index_uint");
      vaoExt = gl2 ? null : gl.getExtension("OES_vertex_array_object");
      if (!gl2 && !vaoExt) throw new Error("This browser's WebGL lacks vertex array objects.");
      this.bindVAO = v => gl2 ? gl.bindVertexArray(v) : vaoExt.bindVertexArrayOES(v);
      prog = gl.createProgram();
      gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, LOT_SHADER.vertex));
      gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, LOT_SHADER.fragment));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      for (const u of ["u_matrix", "u_hard", "u_scenario", "u_limit", "u_opacity", "u_sel", "u_selShare", "u_permeable", "u_impermeable", "u_over", "u_out"])
        loc[u] = gl.getUniformLocation(prog, u);
      vao = gl2 ? gl.createVertexArray() : vaoExt.createVertexArrayOES();
      this.bindVAO(vao);
      const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, mesh.verts, gl.STATIC_DRAW);
      const ibo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.idx, gl.STATIC_DRAW);
      [["a_pos", 2, 0], ["a_y", 1, 8], ["a_sc", 1, 12], ["a_roof", 1, 16], ["a_A", 1, 20], ["a_id", 1, 24]].forEach(([name, size, offset]) => {
        const a = gl.getAttribLocation(prog, name);
        gl.enableVertexAttribArray(a);
        gl.vertexAttribPointer(a, size, gl.FLOAT, false, FLOATS * 4, offset);
      });
      this.bindVAO(null);
    },
    render(gl, matrix) {
      const m = Array.from(matrix);
      for (let r = 0; r < 4; r++) m[12 + r] += ORIGIN.x * m[r] + ORIGIN.y * m[4 + r];
      gl.useProgram(prog);
      gl.uniformMatrix4fv(loc.u_matrix, false, m);
      gl.uniform1f(loc.u_hard, state.hard);
      gl.uniform1f(loc.u_scenario, state.mode === "city" ? 1 : 0);
      gl.uniform1f(loc.u_limit, BYLAW.impermeable_limit);
      gl.uniform1f(loc.u_opacity, LOT_OPACITY);
      gl.uniform1f(loc.u_sel, state.lotResult ? state.selected.properties._mi || 0 : 0);
      gl.uniform1f(loc.u_selShare, state.lotResult ? state.lotResult.share : 0);
      gl.uniform3fv(loc.u_permeable, hexToRGB(COLOR.permeable));
      gl.uniform3fv(loc.u_impermeable, hexToRGB(COLOR.impermeable));
      gl.uniform3fv(loc.u_over, hexToRGB(OVER));
      gl.uniform3fv(loc.u_out, hexToRGB(COLOR.out));
      gl.disable(gl.DEPTH_TEST); gl.disable(gl.STENCIL_TEST); gl.disable(gl.CULL_FACE);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      this.bindVAO(vao);
      gl.drawElements(gl.TRIANGLES, mesh.idx.length, gl.UNSIGNED_INT, 0);
      this.bindVAO(null);
    },
  };
}

// Roofs: each footprint carries its site's roof share (a_rs, to the walls). In
// Every-lot mode a roof is hidden until the slider reaches that share. In
// One-lot mode every roof shows.
const ROOF_SHADER = {
  vertex: `
    attribute vec2 a_pos; attribute float a_rs;
    uniform mat4 u_matrix;
    varying float v_rs;
    void main() { gl_Position = u_matrix * vec4(a_pos, 0.0, 1.0); v_rs = a_rs; }`,
  fragment: `
    precision mediump float;
    uniform float u_hard, u_scenario, u_limit, u_opacity;
    uniform vec3 u_color;
    varying float v_rs;
    void main() {
      if (u_scenario > 0.5 && v_rs > u_hard + 1e-5) discard;
      gl_FragColor = vec4(u_color * u_opacity, u_opacity);
    }`,
};

// Find the lot each footprint stands in (footprints are clipped to sites), on a
// grid of lot bounding boxes, and give the footprint that lot's roof share.
function roofShares(buildings, lots) {
  const CELL = 0.001, grid = new Map(), key = (i, j) => i * 100000 + j;
  const ringsOf = g => g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
  for (const f of lots) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const rings of ringsOf(f.geometry)) for (const [x, y] of rings[0]) {
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
    }
    f._bb = [x0, y0, x1, y1];
    for (let i = Math.floor(x0 / CELL); i <= Math.floor(x1 / CELL); i++)
      for (let j = Math.floor(y0 / CELL); j <= Math.floor(y1 / CELL); j++) {
        const k = key(i, j); if (!grid.has(k)) grid.set(k, []); grid.get(k).push(f);
      }
  }
  const inRing = (x, y, r) => {
    let inside = false;
    for (let a = 0, b = r.length - 1; a < r.length; b = a++)
      if ((r[a][1] > y) !== (r[b][1] > y) && x < (r[b][0] - r[a][0]) * (y - r[a][1]) / (r[b][1] - r[a][1]) + r[a][0]) inside = !inside;
    return inside;
  };
  const inLot = (x, y, f) => ringsOf(f.geometry).some(rings => inRing(x, y, rings[0]) && !rings.slice(1).some(h => inRing(x, y, h)));
  for (const b of buildings) {
    const ring = ringsOf(b.geometry)[0]?.[0];
    b._rs = 0;                                    // a roof on no R1-1 lot always shows
    if (!ring) continue;
    let x = 0, y = 0; for (const [px, py] of ring) { x += px; y += py; }
    x /= ring.length; y /= ring.length;
    for (const f of grid.get(key(Math.floor(x / CELL), Math.floor(y / CELL))) || []) {
      const [x0, y0, x1, y1] = f._bb;
      if (x < x0 || x > x1 || y < y0 || y > y1 || !inLot(x, y, f)) continue;
      // at least 1%, so a shed the eave allowance shrinks to nothing still waits for the slider
      const p = f.properties; b._rs = p.A > 0 ? Math.min(1, Math.max(p.rw / p.A, 0.01)) : 0; break;
    }
  }
}

function buildRoofMesh(features) {
  const verts = [], fill = [], lines = [];
  for (const f of features) {
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates]
                : f.geometry.type === "MultiPolygon" ? f.geometry.coordinates : [];
    for (const rings of polys) {
      const base = verts.length / 3, flat = [], holes = [];
      rings.forEach((ring, i) => {
        if (i > 0) holes.push(flat.length / 2);
        const start = flat.length / 2;
        for (const [lng, lat] of ring) {
          const m = maplibregl.MercatorCoordinate.fromLngLat([lng, lat]);
          flat.push(m.x - ORIGIN.x, m.y - ORIGIN.y);
        }
        const end = flat.length / 2;
        for (let k = start; k < end; k++) lines.push(base + k, base + (k + 1 < end ? k + 1 : start));
      });
      for (let i = 0; i < flat.length; i += 2) verts.push(flat[i], flat[i + 1], f._rs);
      for (const k of earcut(flat, holes)) fill.push(base + k);
    }
  }
  return { verts: new Float32Array(verts), fill: new Uint32Array(fill), lines: new Uint32Array(lines) };
}

function roofLayer(mesh) {
  let prog, vao, fillIbo, lineIbo, loc = {}, gl2, vaoExt;
  const compile = (gl, type, src) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  return {
    id: "roofs", type: "custom", renderingMode: "2d",
    onAdd(map, gl) {
      gl2 = typeof WebGL2RenderingContext !== "undefined" && gl instanceof WebGL2RenderingContext;
      if (!gl2) gl.getExtension("OES_element_index_uint");
      vaoExt = gl2 ? null : gl.getExtension("OES_vertex_array_object");
      this.bindVAO = v => gl2 ? gl.bindVertexArray(v) : vaoExt.bindVertexArrayOES(v);
      prog = gl.createProgram();
      gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, ROOF_SHADER.vertex));
      gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, ROOF_SHADER.fragment));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      for (const u of ["u_matrix", "u_hard", "u_scenario", "u_limit", "u_opacity", "u_color"]) loc[u] = gl.getUniformLocation(prog, u);
      vao = gl2 ? gl.createVertexArray() : vaoExt.createVertexArrayOES();
      this.bindVAO(vao);
      const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, mesh.verts, gl.STATIC_DRAW);
      [["a_pos", 2, 0], ["a_rs", 1, 8]].forEach(([name, size, offset]) => {
        const a = gl.getAttribLocation(prog, name);
        gl.enableVertexAttribArray(a);
        gl.vertexAttribPointer(a, size, gl.FLOAT, false, 12, offset);
      });
      this.bindVAO(null);
      fillIbo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, fillIbo);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.fill, gl.STATIC_DRAW);
      lineIbo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, lineIbo);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.lines, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);
    },
    render(gl, matrix) {
      if (map.getZoom() < BUILDINGS_MIN_ZOOM) return;
      const m = Array.from(matrix);
      for (let r = 0; r < 4; r++) m[12 + r] += ORIGIN.x * m[r] + ORIGIN.y * m[4 + r];
      gl.useProgram(prog);
      gl.uniformMatrix4fv(loc.u_matrix, false, m);
      gl.uniform1f(loc.u_hard, state.hard);
      gl.uniform1f(loc.u_scenario, state.mode === "city" ? 1 : 0);
      gl.uniform1f(loc.u_limit, BYLAW.impermeable_limit);
      gl.disable(gl.DEPTH_TEST); gl.disable(gl.STENCIL_TEST); gl.disable(gl.CULL_FACE);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      this.bindVAO(vao);
      gl.uniform1f(loc.u_opacity, 0.9);
      gl.uniform3fv(loc.u_color, hexToRGB(dark ? COLOR.roofDark : COLOR.roof));
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, fillIbo);
      gl.drawElements(gl.TRIANGLES, mesh.fill.length, gl.UNSIGNED_INT, 0);
      if (map.getZoom() >= 16) {
        gl.uniform1f(loc.u_opacity, 1);
        gl.uniform3fv(loc.u_color, hexToRGB(dark ? "#1a1a19" : "#fcfcfb"));
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, lineIbo);
        gl.drawElements(gl.LINES, mesh.lines.length, gl.UNSIGNED_INT, 0);
      }
      this.bindVAO(null);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);
    },
  };
}
