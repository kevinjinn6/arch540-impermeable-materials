<!doctype html>
<!--
================================================================================
 IMPERMEABLE MATERIALS ON R1-1 LOTS  --  the map
================================================================================

WHAT THIS PAGE DOES
  Two lines of Vancouver's R1-1 District Schedule, applied to every ordinary
  R1-1 lot in the city, using the City's own parcel polygons and its 2015
  building footprints:
      s.3.2.2.7  Maximum site coverage for all buildings    50% of the site area
      s.3.2.2.8  Maximum area of impermeable materials      75% of the site area
  and s.4.2.2: the 75% includes the buildings. Section 2 says what counts:
  permeable pavers count as impermeable; wood decking is permeable only with
  spaced boards, on grade, with nothing under it.

  For ONE LOT (click it, or type its address): the roof area the City mapped,
  what that is to the walls once the eave is taken off, how it stands against
  50%, and how much room s.3.2.2.8 leaves for driveways, walks, patios and
  decks. Then a short schedule of what else is on the lot, classified in the
  by-law's words, tested against 75%.

  For THE CITY (the slider): add the same hard landscaping to every lot and
  watch which lots cross 75%. Switch the material from concrete to permeable
  pavers and nothing changes, because Section 2 says they are impermeable.
  Switch to gravel and the limit is never crossed, because gravel is permeable.

  The storm card at the bottom is NOT the by-law. It is a Rain City Strategy
  water balance (a Council policy), kept as context, with its assumptions
  written beside it.

HOW TO OPEN IT
  It needs a small local web server (a browser will not load the data files
  from disk). In a terminal, from the project folder:
      cd map
      python3 -m http.server
  then open  http://localhost:8000  in a browser. The published copy is at
  https://kevinjinn6.github.io/arch540-impermeable-materials/

TO CHANGE THE NUMBERS
  Everything is in the CONFIGURATION block inside the <script> below. Every
  number the page prints is built from those constants; change a constant and
  every sentence follows.

WHERE THE DATA COMES FROM
  data/lots.geojson        one feature per zoning site (buildings.py):
                           k key, ad address, A site area m2, r roof area m2
                           (2015 footprints clipped to the site, to the ROOF
                           EDGE), sc scope (0 ordinary, 1 large site, 2 not a
                           lot), m merged site, f shared address not adjoining,
                           cd check data. If the pipeline has written rw (roof
                           area to the walls) it is used directly.
  data/roof-walls.json     otherwise, rw per site: the same footprints shrunk
                           inwards by the eave allowance before clipping.
  data/buildings.geojson   the 2015 footprints, drawn at street zoom.
================================================================================
-->

<script>
// =============================================================================
//  CONFIGURATION  --  change these numbers, not the code below
// =============================================================================

// ---- The by-law --------------------------------------------------------------
const BYLAW = {
  name: "Zoning and Development By-law No. 3575, R1-1 District Schedule",
  consolidation: "June 2026",
  building_limit: 0.50,      // s.3.2.2.7  maximum site coverage for all buildings
  impermeable_limit: 0.75,   // s.3.2.2.8  maximum area of impermeable materials
  min_site_area_m2: 306,     // s.3.2.2.1  minimum site area, single detached house / duplex
  schedule_url: "https://bylaws.vancouver.ca/zoning/zoning-by-law-district-schedule-r1-1.pdf",
  section2_url: "https://bylaws.vancouver.ca/zoning/zoning-by-law-section-2.pdf",
  repo_url: "https://github.com/kevinjinn6/arch540-impermeable-materials",
};
// The passages, word for word, with their pages in the June 2026 PDFs.
const PASSAGES = {
  s3227: { ref: "s.3.2.2.7, p.12", text: "Maximum site coverage for all buildings — 50% of the site area" },
  s3228: { ref: "s.3.2.2.8, p.12", text: "Maximum area of impermeable materials — 75% of the site area" },
  s422:  { ref: "s.4.2.2, p.16",   text: "The maximum area of impermeable materials includes site coverage for all buildings." },
  imp:   { ref: "Section 2, “Impermeable Materials”, p.20",
           text: "The projected area of the outside of the outermost walls of all buildings, including carports, entries, porches and verandahs, asphalt, concrete, brick, stone, permeable pavers, and wood." },
  perm:  { ref: "Section 2, “Permeable Materials”, p.31",
           text: "Materials including gravel, river rock less than 5 cm in size, wood chips, bark mulch, wood decking with spaced boards and other materials which, in the opinion of the Director of Planning, have fully permeable characteristics when placed or installed on grade with no associated layer of impermeable material, such as plastic sheeting, that would impede the movement of water directly to the soil." },
  site:  { ref: "Section 2, “Site”, p.43", text: "An area of land consisting of 1 or more adjoining parcels or lots abutting on a street not being a lane, but does not include a strata lot …" },
};

// ---- Materials, in the by-law's words ----------------------------------------
// counts = true  -> impermeable under s.3.2.2.8.   The passage each rests on.
const MATERIALS = [
  { id: "concrete",  name: "concrete or asphalt",                       counts: true,  why: "named in “Impermeable Materials” (p.20)" },
  { id: "pavers",    name: "permeable pavers",                          counts: true,  why: "named in “Impermeable Materials” (p.20), despite the name; Council added them by By-law 13670 (26 April 2023) because, in the City's words, “most permeable pavers lose their permeability over time”" },
  { id: "brick",     name: "brick or stone",                            counts: true,  why: "named in “Impermeable Materials” (p.20)" },
  { id: "deck",      name: "wood decking, tight boards or raised",      counts: true,  why: "“wood” is named impermeable (p.20); only spaced boards on grade escape (p.31); a Deck is over 600 mm, so not on grade (p.11)" },
  { id: "building",  name: "building, porch, carport or garage",        counts: true,  why: "“outermost walls of all buildings, including carports, entries, porches and verandahs” (p.20)" },
  { id: "spaced",    name: "wood decking, spaced boards, on grade",     counts: false, why: "“wood decking with spaced boards … on grade with no associated layer of impermeable material” (p.31)" },
  { id: "gravel",    name: "gravel or river rock under 5 cm",           counts: false, why: "named in “Permeable Materials” (p.31), on grade with nothing under it" },
  { id: "mulch",     name: "wood chips or bark mulch",                  counts: false, why: "named in “Permeable Materials” (p.31)" },
  { id: "lawn",      name: "lawn or planting",                          counts: false, why: "ground, not a material; nothing in s.3.2.2.8 counts it" },
];
// The three choices offered for the citywide slider, by id above.
const SLIDER_MATERIALS = ["concrete", "pavers", "gravel"];
const SLIDER_MAX_M2 = 250;             // the slider's reach, in m² added per lot
// Typical hard landscaping, used to prefill a lot's schedule. Edit on the page.
const DEFAULT_SCHEDULE = [
  { label: "Driveway and parking pad", id: "pavers",   m2: 45 },
  { label: "Walks and patio",          id: "concrete", m2: 25 },
  { label: "Deck",                     id: "deck",     m2: 12 },
];

// ---- Measurement ---------------------------------------------------------------
const EAVE_M = 0.45;
// The 2015 footprints follow the ROOF EDGE; the by-law measures a building to
// "the outside of the outermost walls". A Vancouver house roof overhangs by
// about 0.3–0.6 m. Roof areas are shown both ways; the by-law test uses the
// wall estimate, computed by shrinking every footprint inwards by this much
// before clipping it to the site (buildings.py EAVE_M, or data/roof-walls.json).
const NOT_A_SITE_M2 = 150;
// Parcels smaller than this, or flagged by the pipeline (cd: roof over 90%;
// f: shared address, not adjoining), are drawn grey and not assessed: they are
// usually strata remnants or data faults, not sites.

// ---- Rainfall and soil (the storm card; NOT the by-law) ----------------------
const STORM = {
  policy: "Rain City Strategy (2019), a Council policy",
  rainfall_mm: 48,     // the Strategy's daily design standard
  runoff: 0.85,        // share of rain that runs off hard surfaces (this page's assumption)
  soil_mm: 75,         // mm of water the permeable ground holds (good soil; this page's assumption)
  pool_m3: 2500,       // one Olympic pool, for scale
};

// ---- Colours for the lots (CSS variables above hold the panel's) ------------
const COLOR = { permeable: "#287bc1", impermeable: "#d94a48", over: "#9333ea", check: "#ffbf00",
                out: "#b9b8b2", roof: "#3d3d3a", roofDark: "#6b6a65" };
// blue = permeable, red = impermeable (growing from the south edge of each lot, as a diagram),
// purple = the lot is over the 75% cap at this setting, amber = roof alone over 50% even to the walls: check
const LOT_OPACITY = 0.82;
const BUILDINGS_MIN_ZOOM = 14;        // footprints are fetched and drawn from this zoom in

// ---- Where the map opens ---------------------------------------------------------
const OPEN_ADDRESS = "3528 W 30TH AV";          // the README's example lot; "" for none
const OPEN_AT = { center: [-123.17805, 49.24300], zoom: 17.2 };   // used when the address is not found
const CITY_BOUNDS = [[-123.2245, 49.1985], [-123.0236, 49.2951]];

const DATA_FILE = "data/lots.geojson";
const WALLS_FILE = "data/roof-walls.json";
const BUILDINGS_FILE = "data/buildings.geojson";
const VERSION = "2026-10-02";
// =============================================================================
//  END OF CONFIGURATION
// =============================================================================


// ---- PURE: the operation, with no map in it --------------------------------
// Everything below this line up to END PURE is plain arithmetic on a lot's
// numbers, so it can be checked by hand or run outside a browser.
const MAT = Object.fromEntries(MATERIALS.map(m => [m.id, m]));
const pct = x => `${(x * 100).toFixed(1)}%`;
const m2 = x => `${x.toLocaleString("en-CA", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} m²`;
const int = x => Math.round(x).toLocaleString("en-CA");
const roundNice = x => (x >= 1000 ? Math.round(x / 100) * 100 : Math.round(x)).toLocaleString("en-CA");

function normalise(address) {
  return String(address || "").toUpperCase().replace(/[.,]/g, " ").split(/\s+/).filter(Boolean).join(" ");
}

// How a lot stands under the two rules, with `added` m² of a material that
// counts (or not) on top of its roofs. rw is roof area to the walls.
function assess(lot, added, counts) {
  const A = lot.A, r = lot.r, rw = lot.rw;
  const cap50 = BYLAW.building_limit * A, cap75 = BYLAW.impermeable_limit * A;
  const addedCounted = counts ? added : 0;
  const impermeable = Math.min(A, rw + addedCounted);
  const room = cap75 - rw;                        // what s.3.2.2.8 leaves after the roofs
  return {
    A, r, rw, cap50, cap75,
    shareEdge: r / A, shareWall: rw / A,
    over50edge: r > cap50 + 1e-9, over50wall: rw > cap50 + 1e-9,
    room, impermeable, share: impermeable / A,
    over75: impermeable > cap75 + 1e-9,
    margin: cap75 - impermeable,
  };
}

// A schedule of surfaces for one lot: [{id, m2}] -> totals by class.
function sumSchedule(rows) {
  let imp = 0, perm = 0, pavers = 0;
  for (const row of rows) {
    const m = MAT[row.id]; const a = Math.max(0, Number(row.m2) || 0);
    if (!m) continue;
    if (m.counts) imp += a; else perm += a;
    if (row.id === "pavers") pavers += a;
  }
  return { imp, perm, pavers };
}

// Where one lot's storm goes: soaked in, over to the sewer, or left on hard
// surfaces. P rainfall, C runoff share, D soil storage; all in mm; areas in m².
function waterBalance(areaM2, hardShare) {
  const P = STORM.rainfall_mm, C = STORM.runoff, D = STORM.soil_mm;
  const hard = areaM2 * hardShare, perm = areaM2 - hard;
  const rainM3 = P * areaM2 / 1000;
  const reachingM3 = (P * perm + P * C * hard) / 1000;
  const heldM3 = Math.min(reachingM3, D * perm / 1000);
  return { rainM3, heldM3, sewerM3: reachingM3 - heldM3, surfaceM3: rainM3 - reachingM3 };
}

// ---- Drawing the lots on the graphics card -----------------------------------
// Each lot is sent once with four numbers per corner: position, its north-south
// position within the lot, and two per-lot values the slider does not change:
//   a_roof   roof share to the walls, 0-1           a_A  site area, m²
//   a_sc     0 assessed, 1 not assessed (grey)
// The slider sets u_added (m² added to every lot) and u_counts (1 if the added
// material is impermeable under Section 2, else 0). The shader does the rest.
const LOT_SHADER = {
  vertex: `
    precision highp float;
    attribute vec2 a_pos; attribute float a_y; attribute float a_sc; attribute float a_roof; attribute float a_A;
    uniform mat4 u_matrix;
    varying float v_y, v_sc, v_roof, v_A;
    void main() { gl_Position = u_matrix * vec4(a_pos, 0.0, 1.0); v_y = a_y; v_sc = a_sc; v_roof = a_roof; v_A = a_A; }`,
  fragment: `
    precision highp float;
    uniform float u_added, u_counts, u_limit, u_opacity;
    uniform vec3 u_permeable, u_impermeable, u_over, u_out;
    varying float v_y, v_sc, v_roof, v_A;
    void main() {
      float share = min(1.0, v_roof + u_counts * u_added / max(v_A, 1.0));
      vec3 c = v_sc > 0.5 ? u_out
             : share > u_limit + 1e-6 ? u_over
             : (v_y >= 1.0 - share ? u_impermeable : u_permeable);
      gl_FragColor = vec4(c * u_opacity, u_opacity);
    }`,
};
const hexToRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const ORIGIN = maplibregl.MercatorCoordinate.fromLngLat([-123.12, 49.25]);
const FLOATS = 6;

function buildLotMesh(features) {
  const verts = [], idx = [];
  for (const f of features) {
    const p = f.properties;
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates]
                : f.geometry.type === "MultiPolygon" ? f.geometry.coordinates : [];
    let minY = Infinity, maxY = -Infinity;
    for (const rings of polys) for (const ring of rings) for (const [lng, lat] of ring) {
      const m = maplibregl.MercatorCoordinate.fromLngLat([lng, lat]);
      minY = Math.min(minY, m.y); maxY = Math.max(maxY, m.y);
    }
    const ySpan = Math.max(maxY - minY, 1e-12);
    const roof = p.assessed ? Math.min(1, p.rw / p.A) : 0;
    for (const rings of polys) {
      const flat = [], holes = [];
      rings.forEach((ring, i) => {
        if (i > 0) holes.push(flat.length / 3);
        for (const [lng, lat] of ring) {
          const m = maplibregl.MercatorCoordinate.fromLngLat([lng, lat]);
          flat.push(m.x - ORIGIN.x, m.y - ORIGIN.y, (m.y - minY) / ySpan);
        }
      });
      const base = verts.length / FLOATS, tri = [];
      for (let i = 0; i < flat.length; i += 3) {
        verts.push(flat[i], flat[i + 1], flat[i + 2], p.assessed ? 0 : 1, roof, p.A);
        tri.push(flat[i], flat[i + 1]);
      }
      for (const k of earcut(tri, holes)) idx.push(base + k);
    }
  }
  return { verts: new Float32Array(verts), idx: new Uint32Array(idx) };
}

function lotLayer(mesh) {
  let prog, vao, loc = {}, gl2, vaoExt;
  const compile = (gl, type, src) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  return {
    id: "lots", type: "custom", renderingMode: "2d",
    onAdd(map, gl) {
      gl2 = typeof WebGL2RenderingContext !== "undefined" && gl instanceof WebGL2RenderingContext;
      if (!gl2) gl.getExtension("OES_element_index_uint");
      vaoExt = gl2 ? null : gl.getExtension("OES_vertex_array_object");
      if (!gl2 && !vaoExt) throw new Error("This browser's WebGL lacks vertex array objects.");
      this.bindVAO = v => gl2 ? gl.bindVertexArray(v) : vaoExt.bindVertexArrayOES(v);
      prog = gl.createProgram();
      gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, LOT_SHADER.vertex));
      gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, LOT_SHADER.fragment));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      for (const u of ["u_matrix", "u_added", "u_counts", "u_limit", "u_opacity", "u_permeable", "u_impermeable", "u_over", "u_out"])
        loc[u] = gl.getUniformLocation(prog, u);
      vao = gl2 ? gl.createVertexArray() : vaoExt.createVertexArrayOES();
      this.bindVAO(vao);
      const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, mesh.verts, gl.STATIC_DRAW);
      const ibo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.idx, gl.STATIC_DRAW);
      [["a_pos", 2, 0], ["a_y", 1, 8], ["a_sc", 1, 12], ["a_roof", 1, 16], ["a_A", 1, 20]].forEach(([name, size, offset]) => {
        const a = gl.getAttribLocation(prog, name);
        gl.enableVertexAttribArray(a);
        gl.vertexAttribPointer(a, size, gl.FLOAT, false, FLOATS * 4, offset);
      });
      this.bindVAO(null);
    },
    render(gl, matrix) {
      const m = Array.from(matrix);
      for (let r = 0; r < 4; r++) m[12 + r] += ORIGIN.x * m[r] + ORIGIN.y * m[4 + r];
      gl.useProgram(prog);
      gl.uniformMatrix4fv(loc.u_matrix, false, m);
      gl.uniform1f(loc.u_added, state.added);
      gl.uniform1f(loc.u_counts, state.counts ? 1 : 0);
      gl.uniform1f(loc.u_limit, BYLAW.impermeable_limit);
      gl.uniform1f(loc.u_opacity, LOT_OPACITY);
      gl.uniform3fv(loc.u_permeable, hexToRGB(COLOR.permeable));
      gl.uniform3fv(loc.u_impermeable, hexToRGB(COLOR.impermeable));
      gl.uniform3fv(loc.u_over, hexToRGB(COLOR.over));
      gl.uniform3fv(loc.u_out, hexToRGB(COLOR.out));
      gl.disable(gl.DEPTH_TEST); gl.disable(gl.STENCIL_TEST); gl.disable(gl.CULL_FACE);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      this.bindVAO(vao);
      gl.drawElements(gl.TRIANGLES, mesh.idx.length, gl.UNSIGNED_INT, 0);
      this.bindVAO(null);
    },
  };
}

const state = { added: 0, matId: SLIDER_MATERIALS[0], counts: MAT[SLIDER_MATERIALS[0]].counts,

function materialOptions(selectedId) {
  const group = (counts, title) => `<optgroup label="${title}">` + MATERIALS.filter(m => m.counts === counts)
    .map(m => `<option value="${m.id}" ${m.id === selectedId ? "selected" : ""}>${m.name}</option>`).join("") + "</optgroup>";
  return group(true, "Counts as impermeable (p.20)") + group(false, "Does not count (p.31)");
}

function renderLot() {
  const el = document.getElementById("lot");
  const lot = state.selected;
  if (!lot) { el.innerHTML = `<span class="label">Click a lot, or type an address above.</span>`; updateTick(null); return; }
  const p = lot.properties;
  const flags = [];
  if (p.m) flags.push("merged site: adjoining parcels with one address");
  if (p.f) flags.push("shares an address with a parcel it does not adjoin: check");
  if (p.cd) flags.push("roof over 90% of the parcel: check the data");
  if (p.sc === 1) flags.push("large site over 2,000 m²: outside this map's scope");
  if (p.sc === 2) flags.push("road allowance or other non-lot: outside scope");
  if (p.A < NOT_A_SITE_M2) flags.push(`under ${NOT_A_SITE_M2} m²: not assessed as a site`);
  else if (p.A < BYLAW.min_site_area_m2) flags.push(`below the ${BYLAW.min_site_area_m2} m² minimum site area of s.3.2.2.1: an existing small lot, or part of a larger site`);
  let html = `<div class="row"><span class="addr">${p.ad || "R1-1 lot (no civic address)"}</span><span>${m2(p.A)} site</span></div>`;
  if (!p.assessed) {
    html += `<div class="small">${flags.join(". ")}.</div>`;
    el.innerHTML = html; updateTick(null); return;
  }
  const s = assess(p, 0, false);
  const t = sumSchedule(state.schedule);
  const total = Math.min(s.A, s.rw + t.imp);
  const share = total / s.A, overBy = total - s.cap75;

  // The area bar: the site as 100%. Dark = roofs to the walls, red = paving that
  // counts, purple = the part past 75%, blue = room still left under 75%.
  const W = x => `${Math.max(0, Math.min(100, x * 100)).toFixed(2)}%`;
  const L = B.impermeable_limit;
  const redW = Math.max(0, Math.min(share, L) - s.shareWall);
  const purpleW = Math.max(0, share - Math.max(L, s.shareWall));
  const blueW = Math.max(0, L - share);
  html += `<div class="areabar" aria-hidden="true">` +
    `<span style="width:${W(s.shareWall)};background:${COLOR.roof}"></span>` +
    `<span style="width:${W(redW)};background:${COLOR.impermeable}"></span>` +
    `<span style="width:${W(purpleW)};background:${COLOR.over}"></span>` +
    `<span style="width:${W(blueW)};background:${COLOR.permeable}"></span>` +
    `<div class="mark" style="left:${B.building_limit * 100}%"><i>${B.building_limit * 100}%</i></div>` +
    `<div class="mark" style="left:${L * 100}%"><i>${L * 100}%</i></div></div>`;

  const wallsNote = state.wallsFrom ? `${EAVE_M} m eave off` : "no eave data: roof edge used";
  html += `<div class="row"><span>Roofs to the walls <span class="small">(2015; ${wallsNote})</span></span><span>${m2(s.rw)} · ${pct(s.shareWall)}</span></div>`;
  if (s.over50wall)
    html += `<div class="row"><span>s.3.2.2.7 buildings ≤ ${B.building_limit * 100}%</span><span class="verdict check">over, even to the walls: check</span></div>`;
  html += `<div class="row"><span>Room under ${L * 100}% after the roofs</span><span><b>${m2(Math.max(0, s.room))}</b></span></div>`;
  if (flags.length) html += `<div class="small">${flags.join(". ")}.</div>`;

  // The schedule
  html += `<div class="label" style="margin-top:8px">Paving on this lot <span class="small">illustrative; edit it</span></div>`;
  html += `<table class="sched" id="sched">`;
  state.schedule.forEach((row, i) => {
    const m = MAT[row.id];
    html += `<tr><td style="width:34%"><div class="small">${row.label}</div><select data-i="${i}" aria-label="${row.label} material">${materialOptions(row.id)}</select></td>` +
            `<td style="width:64px"><input data-i="${i}" type="number" min="0" step="1" value="${row.m2}" aria-label="${row.label} area in square metres"></td>` +
            `<td><span class="cls ${m.counts ? "imp" : "perm"}">${m.counts ? "counts" : "no"}</span></td></tr>`;
  });
  html += `</table><button class="btn" id="addRow" style="font-size:11px;padding:3px 8px">+ add a surface</button>`;
  html += `<div class="row" style="margin-top:8px"><span>Roofs + paving</span><span><b>${m2(total)} · ${pct(share)}</b></span></div>`;
  html += `<div class="row"><span>s.3.2.2.8</span><span class="verdict ${overBy > 1e-9 ? "fail" : "pass"}">${overBy > 1e-9 ? `FAIL, over by ${m2(overBy)}` : `PASS, ${m2(-overBy)} spare`}</span></div>`;
  if (t.pavers > 0) {
    const ifPerm = (total - t.pavers) / s.A;
    html += `<div class="small">As permeable, the pavers would read ${pct(ifPerm)}. The by-law counts them (p.20).</div>`;
  }
  const st50 = s.over50wall ? "over, even to the walls: check" : s.over50edge ? "within by the walls; the roof edge reads over" : "within";
  const why = state.schedule.map(r => MAT[r.id]).filter((m, i, a) => a.indexOf(m) === i)
    .map(m => `<li><b>${m.name}</b>: ${m.why}</li>`).join("");
  const w = waterBalance(s.A, share);
  html += `<details class="small" style="margin-top:6px"><summary>Arithmetic, passages, storm, Rhino</summary>` +
    `<div class="q">Check by hand: ${L} × ${p.A.toFixed(2)} = ${s.cap75.toFixed(2)}; − ${s.rw.toFixed(2)} roofs = ${s.room.toFixed(2)} m² of room; − ${t.imp.toFixed(2)} paving = ${(s.room - t.imp).toFixed(2)}.</div>` +
    `<div class="q">Roofs to the roof edge ${m2(s.r)} · ${pct(s.shareEdge)}. s.3.2.2.7 buildings ≤ ${B.building_limit * 100}% = ${m2(s.cap50)}: ${st50}. s.3.2.2.8 ≤ ${L * 100}% = ${m2(s.cap75)}, buildings included (s.4.2.2).</div>` +
    `<ul class="notes" style="margin-top:4px">${why}</ul>` +
    `<div class="q">Storm context, not the by-law: in ${STORM.rainfall_mm} mm this lot soaks in ${roundNice(w.heldM3 * 1000)} L and sends ${roundNice(w.sewerM3 * 1000)} L to the sewer (${Math.round(STORM.runoff * 100)}% runoff, ${STORM.soil_mm} mm soil).</div>` +
    `<div class="q">Rhino: set ADDRESSES to “${p.ad}” in map/rhino_site.py and run it.</div></details>`;
  el.innerHTML = html;
  el.querySelectorAll("select").forEach(sel => sel.addEventListener("change", e => {
    state.schedule[+e.target.dataset.i].id = e.target.value; renderLot();
  }));
  el.querySelectorAll("input").forEach(inp => inp.addEventListener("input", e => {
    state.schedule[+e.target.dataset.i].m2 = Math.max(0, Number(e.target.value) || 0);
    renderLotTotalsOnly();
  }));
  const add = document.getElementById("addRow");
  if (add) add.addEventListener("click", () => { state.schedule.push({ label: "Another surface", id: "concrete", m2: 0 }); renderLot(); });
  updateTick(s);
}

// The tick on the slider is the selected lot's room: drag past it and that lot
// is over 75%. The track is blue up to the tick and purple beyond, when the
// added material counts. The thumb is 16 px wide, so its centre runs from 8 px
// to width − 8 px, and the tick is placed on the same scale.
const THUMB_PX = 16;
function updateTick(s) {
  const tick = document.getElementById("roomTick"), label = document.getElementById("roomTickLabel");
  const at = f => `calc(${THUMB_PX / 2}px + (100% - ${THUMB_PX}px) * ${f.toFixed(4)})`;
  if (!s) { tick.hidden = true; slider.style.background = ""; return; }
  const f = Math.max(0, Math.min(1, s.room / SLIDER_MAX_M2));
  tick.hidden = false;
  tick.style.left = at(f);
  tick.className = "tick " + (f < 0.22 ? "l" : f > 0.78 ? "r" : "c");
  label.textContent = s.room <= 0 ? "this lot: no room, roof alone over"
    : s.room > SLIDER_MAX_M2 ? `this lot's room ${int(s.room)} m², past the end`
    : `this lot's room ${int(s.room)} m²`;
  slider.style.background = state.counts
    ? `linear-gradient(to right, ${COLOR.permeable} 0, ${COLOR.permeable} ${at(f)}, ${COLOR.over} ${at(f)}, ${COLOR.over} 100%)`
    : COLOR.permeable;
}
// Typing an area re-renders the whole card, which would steal focus; so only
// the totals are refreshed while typing, by re-rendering after a short pause.
let totalsTimer = null;
function renderLotTotalsOnly() { clearTimeout(totalsTimer); totalsTimer = setTimeout(renderLot, 600); }

function selectLot(feature, fly) {
  state.selected = feature;
  state.schedule = DEFAULT_SCHEDULE.map(r => ({ ...r }));
  if (map.getLayer("selected")) map.setFilter("selected", ["==", ["get", "k"], feature.properties.k]);
  if (fly) {
    const [x, y] = featureCenter(feature);
    map.easeTo({ center: [x, y], zoom: Math.max(map.getZoom(), 17) });
  }
  renderLot();
}

function featureCenter(feature) {
  const pts = [];
  const visit = v => { if (!Array.isArray(v)) return; if (typeof v[0] === "number") pts.push(v); else v.forEach(visit); };
  visit(feature.geometry.coordinates);
  const b = pts.reduce((b, p) => [Math.min(b[0], p[0]), Math.min(b[1], p[1]), Math.max(b[2], p[0]), Math.max(b[3], p[1])],
                       [Infinity, Infinity, -Infinity, -Infinity]);
  return [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2];
}

function findAddress(text) {
  const want = normalise(text);
  if (!want) return null;
  const exact = state.lots.filter(f => normalise(f.properties.ad) === want);
  if (exact.length) return exact[0];
  const starts = state.lots.filter(f => normalise(f.properties.ad).startsWith(want));
  return starts.length ? starts[0] : null;
}
document.getElementById("addrGo").addEventListener("click", () => {
  const f = findAddress(document.getElementById("addr").value);
  if (f) selectLot(f, true);
  else document.getElementById("lot").innerHTML = `<span class="label">No R1-1 lot matches “${document.getElementById("addr").value}”. Spell it the City's way: number, street, AV / ST / DR.</span>`;
});
document.getElementById("addr").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("addrGo").click(); });

// ---- Every lot -----------------------------------------------------------------------
function cityUpdate() {
  if (!state.assessed.length) return;
  const n = state.assessed.length;
  let over = 0, overRoofOnly = 0, tooLittleRoom = 0;
  const totals = { rainM3: 0, heldM3: 0, sewerM3: 0, surfaceM3: 0 };
  for (const p of state.assessed) {
    const s = assess(p, state.added, state.counts);
    if (s.over75) over++;
    if (s.rw > s.cap75 + 1e-9) overRoofOnly++;
    if (s.room < state.added) tooLittleRoom++;
    const w = waterBalance(s.A, s.share);
    for (const k in totals) totals[k] += w[k];
  }
  const mat = MAT[state.matId];
  const readout = document.getElementById("addedReadout");
  readout.textContent = `${state.added} m²`;
  const sel = state.selected && state.selected.properties.assessed ? assess(state.selected.properties, 0, false) : null;
  readout.className = sel && state.counts && state.added > sel.room + 1e-9 ? "over" : "";
  const pctOver = (over / n * 100).toFixed(1);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  document.getElementById("cityStatus").innerHTML =
    `<div class="count"><b class="${over ? "over" : ""}">${int(over)}</b><span>of ${int(n)} lots over ${B.impermeable_limit * 100}% (${pctOver}%)</span></div>` +
    `<p class="small">${state.added === 0
      ? `Roofs alone, to the walls. Drag to add paving to every lot.`
      : mat.counts
        ? `Lots with under ${state.added} m² of room after their roofs.${mat.id === "pavers" ? " Pavers count the same as concrete (p.20)." : ""}`
        : `${cap(mat.name)} does not count (p.31). As pavers, ${int(tooLittleRoom)} lots would be over.`}</p>` +
    `<div class="count"><b class="check">${int(state.count50wall)}</b><span>roofs over ${B.building_limit * 100}% even to the walls: check</span></div>` +
    `<p class="small">${int(state.count50edge)} to the roof edge; the ${EAVE_M} m eave allowance leaves ${int(state.count50wall)}. The air photo cannot say which is right.</p>`;
  const share = k => totals.rainM3 > 0 ? totals[k] / totals.rainM3 * 100 : 0;
  document.getElementById("waterTitle").textContent =
    `${STORM.rainfall_mm} mm storm, every lot as set above`;
  document.getElementById("barHeld").style.width = `${share("heldM3")}%`;
  document.getElementById("barSewer").style.width = `${share("sewerM3")}%`;
  document.getElementById("barSurface").style.width = `${share("surfaceM3")}%`;
  document.getElementById("waterText").innerHTML =
    `<b>${Math.round(share("heldM3"))}%</b> soaks in · ` +
    (totals.sewerM3 < 1 ? `nothing to the storm sewer`
      : `<b>${roundNice(totals.sewerM3)} m³</b> to the storm sewer, about ${(totals.sewerM3 / STORM.pool_m3).toFixed(0)} Olympic pools`);
  document.getElementById("waterNote").textContent =
    `${STORM.policy}; R1-1 has no retention rule. ${Math.round(STORM.runoff * 100)}% runoff and ${STORM.soil_mm} mm soil storage are assumptions.`;
  renderLot();
  map.triggerRepaint();
}
for (const [id, c] of [["barHeld", COLOR.permeable], ["barSewer", COLOR.over], ["barSurface", COLOR.out]])
  document.getElementById(id).style.background = c;
slider.addEventListener("input", () => { state.added = +slider.value; cityUpdate(); });
document.querySelectorAll("#mat button").forEach(b => b.addEventListener("click", () => {
  state.matId = b.dataset.id; state.counts = MAT[state.matId].counts;
  document.querySelectorAll("#mat button").forEach(x => x.setAttribute("aria-pressed", x === b));
  cityUpdate();
}));
document.getElementById("cityBtn").addEventListener("click", () => map.fitBounds(CITY_BOUNDS, { padding: 20 }));

// ---- Load ------------------------------------------------------------------------------
map.on("load", async () => {
  let data, walls = null;
  try {
    data = await (await fetch(DATA_FILE)).json();
  } catch (e) {
    fail(`Could not load ${DATA_FILE}. Run python3 buildings.py from the project root to generate the lot data, then open this page through  python3 -m http.server  (see the top of this file).`);
    return;
  }
  const hasRw = data.features.length && data.features.every(f => f.properties.rw !== undefined);
  if (hasRw) state.wallsFrom = "lots.geojson";
  else {
    try { walls = await (await fetch(WALLS_FILE)).json(); state.wallsFrom = WALLS_FILE; }
    catch (e) { console.warn(`${WALLS_FILE} not found; roof areas are used as traced (roof edge).`); }
  }
  // Attach rw and the assessed flag to every feature; both the mesh and the labels read them.
  for (const f of data.features) {
    const p = f.properties;
    p.A = Number(p.A); p.r = Number(p.r || 0);
    p.rw = hasRw ? Number(p.rw) : walls && walls.rw[p.k] !== undefined ? Number(walls.rw[p.k]) : p.r;
    p.rw = Math.min(p.rw, p.r);
    p.assessed = p.sc === 0 && !p.cd && !p.f && p.A >= NOT_A_SITE_M2 ? 1 : 0;
  }
  state.lots = data.features;
  state.byKey = new Map(data.features.map(f => [f.properties.k, f]));
  state.assessed = data.features.filter(f => f.properties.assessed).map(f => f.properties);
  state.count50edge = state.assessed.filter(p => p.r > BYLAW.building_limit * p.A + 1e-9).length;
  state.count50wall = state.assessed.filter(p => p.rw > BYLAW.building_limit * p.A + 1e-9).length;

  map.addSource("lots", { type: "geojson", data });
  map.getStyle().layers.filter(l => l["source-layer"] === "building")
     .forEach(l => map.setLayoutProperty(l.id, "visibility", "none"));
  const firstLabel = map.getStyle().layers.find(l => l.type === "symbol")?.id;
  map.addLayer(lotLayer(buildLotMesh(data.features)), firstLabel);
  map.addLayer({ id: "lot-hit-area", type: "fill", source: "lots", paint: { "fill-color": "#000", "fill-opacity": 0.02 } }, firstLabel);
  map.addLayer({ id: "lot-edges", type: "line", source: "lots", minzoom: 15,
    paint: { "line-color": dark ? "#1a1a19" : "#fcfcfb", "line-width": ["interpolate", ["linear"], ["zoom"], 15, 0.3, 18, 1.5] } }, firstLabel);
  // Roofs over 50% even to the walls: an amber outline, "check".
  const checkFilter = ["all", ["==", ["get", "assessed"], 1], [">", ["get", "rw"], ["*", BYLAW.building_limit, ["get", "A"]]]];
  for (const [id, color, width] of [
    ["check-50-casing", "#17212b", ["interpolate", ["linear"], ["zoom"], 15, 2.5, 18, 6]],
    ["check-50", COLOR.check, ["interpolate", ["linear"], ["zoom"], 15, 1, 18, 3.5]],
  ]) {
    map.addLayer({ id, type: "line", source: "lots", minzoom: 15, filter: checkFilter,
      layout: { "line-join": "round" }, paint: { "line-color": color, "line-width": width } }, firstLabel);
  }
  // Zoomed out, the same sites as amber circles with counts; click a circle to zoom in.
  const checkSites = data.features.filter(f => f.properties.assessed && f.properties.rw > BYLAW.building_limit * f.properties.A + 1e-9);
  map.addSource("check-points", { type: "geojson", cluster: true, clusterRadius: 44, clusterMaxZoom: 15,
    data: { type: "FeatureCollection", features: checkSites.map(f => ({ type: "Feature", properties: { k: f.properties.k },
      geometry: { type: "Point", coordinates: featureCenter(f) } })) } });
  map.addLayer({ id: "check-clusters", type: "circle", source: "check-points", filter: ["has", "point_count"],
    paint: { "circle-color": COLOR.check, "circle-radius": ["step", ["get", "point_count"], 15, 20, 19, 100, 24, 500, 30],
             "circle-stroke-color": "#17212b", "circle-stroke-width": 2, "circle-opacity": 0.96 } }, firstLabel);
  map.addLayer({ id: "check-cluster-counts", type: "symbol", source: "check-points", filter: ["has", "point_count"],
    layout: { "text-field": ["get", "point_count_abbreviated"], "text-font": ["Noto Sans Bold"], "text-size": 12, "text-allow-overlap": true },
    paint: { "text-color": "#17212b" } }, firstLabel);
  map.addLayer({ id: "check-single", type: "circle", source: "check-points", filter: ["!", ["has", "point_count"]], maxzoom: 15.5,
    paint: { "circle-color": COLOR.check, "circle-radius": 5, "circle-stroke-color": "#17212b", "circle-stroke-width": 1.5 } }, firstLabel);
  map.on("click", "check-clusters", e => map.easeTo({ center: e.lngLat, zoom: Math.min(map.getZoom() + 2, 18) }));
  map.on("click", "check-single", e => { const f = state.byKey.get(e.features[0].properties.k); if (f) selectLot(f, true); });
  for (const id of ["check-clusters", "check-single"]) {
    map.on("mouseenter", id, () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", id, () => { map.getCanvas().style.cursor = ""; });
  }
  map.addLayer({ id: "selected", type: "line", source: "lots", filter: ["==", ["get", "k"], ""],
    layout: { "line-join": "round" },
    paint: { "line-color": dark ? "#f0efec" : "#1f1f1d", "line-width": 3 } }, firstLabel);
  map.addLayer({ id: "labels", type: "symbol", source: "lots", minzoom: 17.5,
    filter: ["==", ["get", "assessed"], 1],
    layout: {
      "text-field": ["concat", "roofs ", ["to-string", ["round", ["*", 100, ["/", ["get", "rw"], ["get", "A"]]]]], "% · room ",
                     ["to-string", ["round", ["-", ["*", BYLAW.impermeable_limit, ["get", "A"]], ["get", "rw"]]]], " m²"],
      "text-font": ["Noto Sans Regular"], "text-size": 10, "symbol-placement": "point" },
    paint: { "text-color": dark ? "#f0efec" : "#1f1f1d", "text-halo-color": dark ? "#1a1a19" : "#fcfcfb", "text-halo-width": 1.5 } });
  map.addLayer({ id: "scope-labels", type: "symbol", source: "lots", minzoom: 16,
    filter: ["any", ["==", ["get", "sc"], 1], ["==", ["get", "cd"], 1], ["==", ["get", "f"], 1]],
    layout: { "text-field": ["case", ["==", ["get", "sc"], 1], "Large site: outside scope", "Check data"],
              "text-font": ["Noto Sans Bold"], "text-size": 11, "symbol-placement": "point" },
    paint: { "text-color": dark ? "#f0efec" : "#1f1f1d", "text-halo-color": dark ? "#1a1a19" : "#fcfcfb", "text-halo-width": 1.5 } });

  map.on("click", "lot-hit-area", e => {
    if (map.queryRenderedFeatures(e.point, { layers: ["check-clusters", "check-single"] }).length) return;
    const f = e.features && e.features[0];
    if (f) selectLot(state.byKey.get(f.properties.k) || f, false);
  });
  map.on("mouseenter", "lot-hit-area", () => { map.getCanvas().style.cursor = "pointer"; });
  map.on("mouseleave", "lot-hit-area", () => { map.getCanvas().style.cursor = ""; });

  loading.remove();
  slider.disabled = false;
  const opening = OPEN_ADDRESS ? findAddress(OPEN_ADDRESS) : null;
  if (opening) selectLot(opening, true); else renderLot();
  cityUpdate();

  // Footprints: fetched the first time the map is close enough to show them.
  let footprintsRequested = false;
  const loadFootprints = async () => {
    if (footprintsRequested || map.getZoom() < BUILDINGS_MIN_ZOOM) return;
    footprintsRequested = true;
    try {
      const res = await fetch(BUILDINGS_FILE);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      const buildings = await res.json();
      for (const f of buildings.features) f.properties = {};        // the page reads nothing from them
      map.addSource("roofs", { type: "geojson", data: buildings });
      map.addLayer({ id: "roofs", type: "fill", source: "roofs", minzoom: BUILDINGS_MIN_ZOOM,
        paint: { "fill-color": dark ? COLOR.roofDark : COLOR.roof, "fill-opacity": 0.9 } }, "selected");
      map.addLayer({ id: "roof-edges", type: "line", source: "roofs", minzoom: 16,
        paint: { "line-color": dark ? "#1a1a19" : "#fcfcfb", "line-width": 0.6 } }, "selected");
    } catch (e) {
      console.warn(`Could not load ${BUILDINGS_FILE}; roofs are not drawn.`, e);
      document.getElementById("legendNote").textContent += " Roof outlines could not be loaded; the numbers still include them.";
    }
  };
  map.on("zoomend", loadFootprints);
  loadFootprints();
});
</script>
</body>
</html>
