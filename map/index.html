function materialOptions(selectedId) {
  const group = (counts, title) => `<optgroup label="${title}">` + MATERIALS.filter(m => m.counts === counts)
    .map(m => `<option value="${m.id}" ${m.id === selectedId ? "selected" : ""}>${cap(m.name)}</option>`).join("") + "</optgroup>";
  return group(true, `Counts as impermeable (${pageOf(PASSAGES.imp.ref)})`) + group(false, `Does not count (${pageOf(PASSAGES.perm.ref)})`);
}
// What a material's row says beside its dot.
const clsLabel = m => m.id === "pavers" ? "Counts, despite the name"
  : m.counts ? `Counts · ${pageOf(PASSAGES.imp.ref)}` : `Doesn't count · ${pageOf(PASSAGES.perm.ref)}`;

function lotFlags(p) {
  const flags = [];
  if (p.m) flags.push("merged site: adjoining parcels with one address");
  if (p.f) flags.push("shares an address with a parcel it does not adjoin: check");
  if (p.cd) flags.push("roof over 90% of the parcel: check the data");
  if (p.sc === 1) flags.push("large site over 2,000 m²: outside this map's scope");
  if (p.sc === 2) flags.push("road allowance or other non-lot: outside scope");
  if (p.A < NOT_A_SITE_M2) flags.push(`under ${NOT_A_SITE_M2} m²: not assessed as a site`);
  else if (p.A < BYLAW.min_site_area_m2) flags.push(`below the ${BYLAW.min_site_area_m2} m² minimum site area of s.3.2.2.1: an existing small lot, or part of a larger site`);
  return flags;
}
function openNotes() { $("bylaw").open = true; $("notes").scrollIntoView({ behavior: "smooth", block: "start" }); }

// The card's structure. Built when a lot is chosen or a surface is added, removed
// or reclassified. The figures that change while typing are filled by renderLotTotals.
function renderLot() {
  const el = $("lot");
  const lot = state.selected;
  if (!lot) {
    el.innerHTML = state.ready ? `<p class="empty">Select a lot on the map, or search an address.</p>` : skeleton();
    state.lotResult = null; updateTick(null); renderChip(); renderPeek(); return;
  }
  const p = lot.properties;
  const flags = lotFlags(p);
  let html = `<div class="lot-head"><span class="addr">${p.ad || "R1-1 lot (no civic address)"}</span><span class="caption">${m2(p.A)} site</span></div>`;
  if (!p.assessed) {
    html += `<div class="areabar out" aria-hidden="true"></div>` +
      `<div class="verdict"><span class="pill out">Not assessed</span></div>` +
      `<p style="margin:8px 0 0">${cap(flags.join(". "))}.</p>` +
      `<div class="rows"><button type="button" class="row linkrow" id="whyGrey">Why some lots are grey${CHEV}</button></div>`;
    el.innerHTML = html;
    $("whyGrey").addEventListener("click", openNotes);
    state.lotResult = null; updateTick(null); renderChip(); renderPeek(); return;
  }
  const s = assess(p, 0, false);
  const wallsNote = state.wallsFrom ? `${EAVE_M} m eave off` : "no eave data: roof edge used";
  const st50 = s.over50wall ? "Over, even to the walls: check the data and the year."
    : s.over50edge ? "Within by the walls; the roof edge alone reads over." : "Within.";

  // The area bar: the site as 100%. Dark = roofs to the walls, red = paving that
  // counts, purple = the part past 75%, blue = room still left under 75%.
  html += `<div class="areabar" id="areabar" aria-hidden="true">` +
    `<span id="barRoof"></span><span id="barRed"></span><span id="barOver"></span><span id="barBlue"></span>` +
    `<div class="mark" style="left:${B.building_limit * 100}%"><i>${B.building_limit * 100}%</i></div>` +
    `<div class="mark" style="left:${L * 100}%"><i>${L * 100}%</i></div>` +
    `<div class="ghost" id="barGhost" hidden><i>if pavers were permeable</i></div></div>`;
  // The verdict, then the passage it rests on, one tap away.
  html += `<div class="verdict" aria-live="polite"><span class="pill" id="pill"></span><b class="display" id="margin"></b></div>` +
    `<details class="ref"><summary class="caption">${chip(shortRef(P75.ref))} · with the paving below</summary>${passage("s3228")}</details>`;
  // Three facts: the roofs, the 50% rule, the room.
  html += `<div class="facts">` +
    `<div class="fact"><div class="fact-row"><span>Roofs</span><span class="num">${m2(s.rw)} · ${pct(s.shareWall)}</span></div>` +
    `<div class="caption">2015, to the walls (${wallsNote}) · ${m2(s.r)} to the roof edge</div></div>` +
    `<details class="fact ref"><summary class="fact-row"><span>Buildings ≤ ${B.building_limit * 100}%</span><span class="num">` +
    (s.over50wall ? `<span class="pill check">Check</span>` : `<span class="pass">✓ within</span>`) + chip(shortRef(P50.ref)) + `</span></summary>` +
    passage("s3227") + `<div class="caption" style="margin-top:4px">${B.building_limit * 100}% of ${m2(s.A)} = ${m2(s.cap50)}. ${st50}</div></details>` +
    `<details class="fact ref"><summary class="fact-row"><span>Room after roofs</span><span class="num"><b>${m2(Math.max(0, s.room))}</b>` +
    chip(`${P75.ref.split(",")[0]} · ${PASSAGES.s422.ref.split(",")[0]}`) + `</span></summary>` + passage("s3228") + passage("s422") +
    `<div class="caption" style="margin-top:4px">${L} × ${m2(s.A)} = ${m2(s.cap75)}, buildings included; − ${m2(s.rw)} roofs.</div></details></div>`;
  if (flags.length) html += `<p class="caption" style="margin:4px 0 0">${cap(flags.join(". "))}.</p>`;

  // The schedule: one row per surface, classified in the by-law's words.
  // The figures are examples, not measurements, and start again for each lot.
  html += `<div class="sec"><h2>Paving</h2><button type="button" class="linkbtn caption" id="resetSched"${scheduleEdited() ? "" : " hidden"}>Reset to the example</button></div>` +
    `<p class="caption" style="margin:2px 0 0">Example figures, not measured. Edit them; they start again for each lot you pick.</p><ul class="sched" id="sched">`;
  state.schedule.forEach((row, i) => {
    const m = MAT[row.id], name = esc(row.label || "this surface");
    row.uid ??= ++rowSeq;
    html += `<li class="srow">` +
      `<div class="srow-top"><input class="lbl" data-i="${i}" type="text" maxlength="40" value="${esc(row.label)}" placeholder="Name this surface" aria-label="Surface name"><span class="amt">` +
      `<input id="m2-${i}" data-i="${i}" type="number" min="0" step="any" inputmode="decimal" value="${row.m2}" aria-label="${name} area in square metres"><span class="caption">m²</span>` +
      `<button type="button" class="rm" data-i="${i}" aria-label="Remove ${name}"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="9" cy="9" r="7"></circle><path d="M5.5 9h7" stroke-linecap="round"></path></svg></button></span></div>` +
      `<div class="srow-bot"><span class="sel"><select data-i="${i}" aria-label="${name} material">${materialOptions(row.id)}</select>${CHEVD}</span>` +
      `<details class="cls" data-k="cls-${row.uid}"><summary class="caption"><span class="dot ${m.counts ? "imp" : "perm"}"></span><span class="lab">${clsLabel(m)}</span></summary>` +
      `<div class="caption why">${cap(m.why)}.</div></details></div></li>`;
  });
  html += `</ul>`;
  // A removed row can be put back for a few seconds.
  if (state.removed) html += `<div class="undo" id="undoBar" role="status"><span>Removed “${esc(state.removed.row.label || "surface")}”</span>` +
    `<button type="button" class="linkbtn" id="undoRm">Undo</button></div>`;
  html += `<button type="button" class="linkbtn" id="addRow" style="display:flex;align-items:center;height:var(--row)">+ Add a surface</button>`;
  html += `<div class="fact-row total"><span>Roofs + paving</span><span class="num" id="totalOut"></span></div>`;
  html += `<div class="rows">` +
    `<details class="row"><summary>Check the arithmetic${CHEV}</summary><div class="hand" id="handCheck"></div></details>` +
    `<details class="row"><summary><span>Storm <span class="caption">· Council policy, not the by-law</span></span>${CHEV}</summary><div class="caption pad" id="lotStorm"></div></details>` +
    `<details class="row"><summary>Draw it in Rhino${CHEV}</summary><div class="caption pad">Set ADDRESSES to “${p.ad}” in <code>map/rhino_site.py</code> and run it in Rhino. It draws the site, its 2015 roofs and this bar.</div></details>` +
    `</div>`;
  // A rebuild of the same lot keeps whatever the reader had opened.
  const sameLot = el.dataset.lot === p.k;
  const openFixed = sameLot ? [...el.querySelectorAll("details:not(.cls)")].map(d => d.open) : [];
  const openRows = sameLot ? new Set([...el.querySelectorAll("details.cls[open]")].map(d => d.dataset.k)) : new Set();
  el.innerHTML = html;
  el.dataset.lot = p.k;
  el.querySelectorAll("details:not(.cls)").forEach((d, k) => { if (openFixed[k]) d.open = true; });
  el.querySelectorAll("details.cls").forEach(d => { if (openRows.has(d.dataset.k)) d.open = true; });

  // A new material changes only its own row and the figures, so nothing closes.
  el.querySelectorAll("select").forEach(sel => sel.addEventListener("change", e => {
    const m = MAT[e.target.value];
    state.schedule[+e.target.dataset.i].id = m.id;
    const cls = e.target.closest(".srow").querySelector(".cls");
    cls.querySelector(".dot").className = `dot ${m.counts ? "imp" : "perm"}`;
    cls.querySelector(".lab").textContent = clsLabel(m);
    cls.querySelector(".why").textContent = `${cap(m.why)}.`;
    scheduleChanged();
  }));
  el.querySelectorAll("input[type=number]").forEach(inp => inp.addEventListener("input", e => {
    state.schedule[+e.target.dataset.i].m2 = Math.max(0, Number(e.target.value) || 0);
    scheduleChanged();                       // only the figures move; the field keeps focus
  }));
  el.querySelectorAll("input.lbl").forEach(inp => inp.addEventListener("input", e => {
    const i = +e.target.dataset.i, li = e.target.closest(".srow"), name = e.target.value.trim();
    state.schedule[i].label = name;
    const n = name || "this surface";
    li.querySelector("input[type=number]").setAttribute("aria-label", `${n} area in square metres`);
    li.querySelector("select").setAttribute("aria-label", `${n} material`);
    li.querySelector(".rm").setAttribute("aria-label", `Remove ${n}`);
    scheduleChanged();
  }));
  el.querySelectorAll(".rm").forEach(b => b.addEventListener("click", e => {
    const i = +e.currentTarget.dataset.i;
    clearTimeout(state.removed?.timer);
    state.removed = { row: state.schedule.splice(i, 1)[0], i,
      timer: setTimeout(() => { state.removed = null; $("undoBar")?.remove(); }, UNDO_MS) };
    renderLot();
    $("undoRm")?.focus();
  }));
  $("undoRm")?.addEventListener("click", () => {
    const { row, i, timer } = state.removed; clearTimeout(timer); state.removed = null;
    state.schedule.splice(Math.min(i, state.schedule.length), 0, row);
    renderLot();
  });
  $("resetSched").addEventListener("click", () => { resetSchedule(); renderLot(); });
  $("addRow").addEventListener("click", () => {
    dropUndo();
    state.schedule.push({ label: "", id: "concrete", m2: 0 });
    renderLot();
    const names = el.querySelectorAll("input.lbl"); names[names.length - 1]?.focus();
  });
  renderLotTotals();
}

// The schedule helpers: the example rows, whether they have been edited, the undo.
let rowSeq = 0;
const UNDO_MS = 8000;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const scheduleEdited = () => state.schedule.length !== DEFAULT_SCHEDULE.length ||
  state.schedule.some((r, i) => r.label !== DEFAULT_SCHEDULE[i].label || r.id !== DEFAULT_SCHEDULE[i].id || r.m2 !== DEFAULT_SCHEDULE[i].m2);
function dropUndo() { clearTimeout(state.removed?.timer); state.removed = null; }
function resetSchedule() { dropUndo(); state.schedule = DEFAULT_SCHEDULE.map(r => ({ ...r })); }
function scheduleChanged() {
  const b = $("resetSched"); if (b) b.hidden = !scheduleEdited();
  renderLotTotals();
}

// The figures that change while typing: the bar, the verdict, the total, the hand check, the tick.
function renderLotTotals() {
  const lot = state.selected;
  if (!lot || !lot.properties.assessed || !$("barRoof")) { state.lotResult = null; updateTick(null); renderChip(); renderPeek(); return; }
  const p = lot.properties;
  const s = assess(p, 0, false);
  const t = sumSchedule(state.schedule);
  const total = Math.min(s.A, s.rw + t.imp);
  const share = total / s.A, overBy = total - s.cap75, over = overBy > 1e-9;
  const W = x => `${Math.max(0, Math.min(100, x * 100)).toFixed(2)}%`;
  $("barRoof").style.width = W(s.shareWall);
  $("barRed").style.width = W(Math.max(0, Math.min(share, L) - s.shareWall));
  $("barOver").style.width = W(Math.max(0, share - Math.max(L, s.shareWall)));
  $("barBlue").style.width = W(Math.max(0, L - share));
  const ghost = $("barGhost");
  if (t.pavers > 0) { ghost.hidden = false; ghost.style.left = W((total - t.pavers) / s.A); } else ghost.hidden = true;
  $("areabar").classList.toggle("ghosted", t.pavers > 0);
  $("pill").className = `pill ${over ? "fail" : "pass"}`; $("pill").textContent = over ? "Fail" : "Pass";
  $("margin").className = `display ${over ? "fail" : "pass"}`; $("margin").textContent = over ? `${m2(overBy)} over` : `${m2(-overBy)} spare`;
  $("totalOut").innerHTML = `<b class="${over ? "fail" : ""}">${m2(total)} · ${pct(share)}</b>`;
  const spare = s.room - t.imp;
  $("handCheck").innerHTML = [
    [`${L} × ${p.A.toFixed(2)}`, `= ${s.cap75.toFixed(2)}`, `limit under ${P75.ref.split(",")[0]}`],
    [`− roofs`, s.rw.toFixed(2), `2015, to the walls`],
    [`= room`, s.room.toFixed(2), ``],
    [`− paving`, t.imp.toFixed(2), `the schedule above`],
    [`= ${spare < -1e-9 ? "over" : "spare"}`, Math.abs(spare).toFixed(2), over ? "FAIL" : "PASS"],
  ].map(([a, b, c]) => `<span>${a}</span><b>${b}</b><span>${c}</span>`).join("");
  const w = waterBalance(s.A, share);
  $("lotStorm").textContent = `In a ${STORM.rainfall_mm} mm storm this lot soaks in ${roundNice(w.heldM3 * 1000)} L and sends ${roundNice(w.sewerM3 * 1000)} L to the storm sewer ` +
    `(${Math.round(STORM.runoff * 100)}% runoff, ${STORM.soil_mm} mm soil). ${STORM.policy}; R1-1 has no retention rule.`;
  state.lotResult = { s, t, total, share, overBy, over };
  updateTick(s); renderChip(); renderPeek();
  if (state.ready) map.triggerRepaint();     // the selected lot on the map follows its bar
}

// The one-line chip that carries the selected lot into Every-lot mode.
function renderChip() {
  const el = $("lotChip"), lot = state.selected;
  if (!lot) { el.innerHTML = `<span class="txt caption">No lot selected</span><button type="button" class="linkbtn" id="chipChange">Choose a lot ›</button>`; }
  else {
    const p = lot.properties;
    const tail = p.assessed ? `· roofs ${pct(p.rw / p.A)}` : `· not assessed`;
    el.innerHTML = `<span class="dotink"></span><span class="txt">${p.ad || "R1-1 lot (no civic address)"} <span class="caption">${tail}</span></span>` +
      `<button type="button" class="linkbtn" id="chipChange">Change ›</button>`;
  }
  $("chipChange").addEventListener("click", () => setMode("lot"));
}

// The phone's peek row: the answer in one line while the map stays visible.
function renderPeek() {
  const el = $("peek");
  if (state.mode === "city") {
    const c = state.city;
    el.innerHTML = c ? `<div class="peek-row"><span class="addr">${Math.round(state.hard * 100)}% impermeable</span>` +
      (state.hard > L + 1e-9 ? `<span class="caption over">every lot over ${L * 100}%</span></div>`
        : `<span class="caption">${int(c.shown)} of ${int(c.houses)} houses fit</span></div>`) : `<span class="caption">Loading…</span>`;
    return;
  }
  const lot = state.selected;
  if (!lot) { el.innerHTML = `<span class="caption">${state.ready ? "Select a lot on the map, or search an address." : "Loading 62,000 lots…"}</span>`; return; }
  const p = lot.properties, r = state.lotResult;
  if (!p.assessed || !r) { el.innerHTML = `<div class="peek-row"><span class="addr">${p.ad || "R1-1 lot"}</span><span class="pill out">Not assessed</span></div>`; return; }
  el.innerHTML = `<div class="peek-row"><span class="addr">${p.ad}</span><span class="pill ${r.over ? "fail" : "pass"}">${r.over ? "Fail" : "Pass"}</span></div>` +
    `<div class="caption"><b class="${r.over ? "fail" : "pass"}">${r.over ? `${m2(r.overBy)} over` : `${m2(-r.overBy)} spare`}</b> · room ${int(Math.max(0, r.s.room))} m²</div>`;
}

// The tick on the slider is the selected lot's roof share: its house appears
// there. The thumb is 24 px wide, so its centre runs from 12 px to
// width − 12 px, and the tick is placed on the same scale.
const THUMB_PX = 24;
function updateTick(s) {
  const tick = $("roomTick"), label = $("roomTickLabel");
  const at = f => `calc(${THUMB_PX / 2}px + (100% - ${THUMB_PX}px) * ${f.toFixed(4)})`;
  if (!s) { tick.hidden = true; return; }
  const f = Math.max(0, Math.min(1, s.shareWall));
  tick.hidden = false;
  tick.style.left = at(f);
  tick.className = "tick " + (f < 0.22 ? "l" : f > 0.78 ? "r" : "c");
  label.textContent = `This lot's roofs · ${pct(s.shareWall)}`;
}

// Fly to a lot at a zoom where it and its block are legible, centred in the
// part of the map the panel leaves clear: the panel is on the left on a
// desktop and a sheet along the bottom on a phone.
function flyToLot(feature) {
  const rect = panel.getBoundingClientRect();
  const offset = innerWidth > 560 ? [rect.right / 2, 0] : [0, -rect.height / 2];
  map.flyTo({ center: featureCenter(feature), zoom: Math.max(map.getZoom(), FIND_ZOOM), offset });
}

function selectLot(feature, fly) {
  state.selected = feature;
  resetSchedule();
  for (const id of ["selected-casing", "selected"])
    if (map.getLayer(id)) map.setFilter(id, ["==", ["get", "k"], feature.properties.k]);
  if (fly) flyToLot(feature);
  addr.value = feature.properties.ad || "";
  addrClear.hidden = false;
  addrError.hidden = true;
  renderLot();
}
function clearSelection() {
  state.selected = null;
  if (map.getLayer("selected")) for (const id of ["selected-casing", "selected"]) if (map.getLayer(id)) map.setFilter(id, ["==", ["get", "k"], ""]);
  addrClear.hidden = true;
  renderLot();
}

function featureCenter(feature) {
  const pts = [];
  const visit = v => { if (!Array.isArray(v)) return; if (typeof v[0] === "number") pts.push(v); else v.forEach(visit); };
  visit(feature.geometry.coordinates);
  const b = pts.reduce((b, p) => [Math.min(b[0], p[0]), Math.min(b[1], p[1]), Math.max(b[2], p[0]), Math.max(b[3], p[1])],
                       [Infinity, Infinity, -Infinity, -Infinity]);
  return [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2];
}

// ---- Address search: suggestions as you type, Enter or a pick to select -----------
const addr = $("addr"), addrList = $("addrList"), addrClear = $("addrClear"), addrError = $("addrError");
function findAddress(text) {
  const want = normalise(text);
  if (!want) return null;
  const exact = state.lots.find(f => f.properties.adn === want);
  if (exact) return exact;
  return state.lots.find(f => f.properties.adn.startsWith(want)) || null;
}
function suggestAddresses(text) {
  const want = normalise(text);
  if (want.length < 3) return [];
  const out = new Set();
  for (const f of state.lots) {
    if (f.properties.adn.startsWith(want)) { out.add(f.properties.ad); if (out.size >= 8) break; }
  }
  return [...out];
}
function searchGo() {
  const f = findAddress(addr.value);
  if (f) selectLot(f, true);
  else {
    addrError.textContent = `No R1-1 lot at “${addr.value}”. Try the City's spelling, like ${OPEN_ADDRESS || "3528 W 30TH AV"}.`;
    addrError.hidden = false;
  }
}
addr.addEventListener("input", () => {
  addrError.hidden = true;
  if (!state.ready) return;
  const want = normalise(addr.value);
  const exact = want ? state.lots.find(f => f.properties.adn === want) : null;
  if (exact) { selectLot(exact, true); return; }           // a suggestion was picked
  addrList.innerHTML = suggestAddresses(addr.value).map(a => `<option value="${a}"></option>`).join("");
});
addr.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); searchGo(); } });
addrClear.addEventListener("click", () => { addr.value = ""; addrList.innerHTML = ""; clearSelection(); addr.focus(); });

// ---- Every lot -----------------------------------------------------------------------
function cityUpdate() {
  if (!state.assessed.length) return;
  const n = state.assessed.length;
  const hardPct = Math.round(state.hard * 100), atMax = Math.abs(state.hard - L) < 1e-9, past = state.hard > L + 1e-9;
  let houses = 0, shown = 0, over = 0;
  const totals = { rainM3: 0, heldM3: 0, sewerM3: 0, surfaceM3: 0 };
  for (const p of state.assessed) {
    const roof = p.rw / p.A;
    if (p.r > 0) { houses++; if (Math.max(roof, 0.01) <= state.hard + 1e-9) shown++; }   // the same 1% floor as the roofs layer
    if (roof > L + 1e-9) over++;
    const w = waterBalance(p.A, state.hard);
    for (const k in totals) totals[k] += w[k];
  }
  state.city = { shown, houses, over, n };
  $("addedReadout").textContent = `${hardPct}%`;
  $("addedReadout").className = past ? "over" : "";
  $("addedMat").textContent = `impermeable, ${100 - hardPct}% permeable, on every lot`;
  $("cityHero").innerHTML = past
    ? `<span class="display over">${int(n)}</span><span>of ${int(n)} lots over ${L * 100}% <span class="caption">· every lot fails</span></span>`
    : `<span class="display">${int(shown)}</span>` +
    `<span>of ${int(houses)} houses fit in ${hardPct}% <span class="caption">· ${(shown / houses * 100).toFixed(1)}%</span></span>`;
  $("cityHint").innerHTML = hardPct === 0
    ? `An empty lot: all permeable. Drag right; each house appears when the slider reaches its roof share.`
    : atMax
      ? `The by-law maximum: every lot is at its limit and passes.` + (over ? ` ${int(over)} ${over === 1 ? "house doesn't fit: its roofs alone are" : "houses don't fit: their roofs alone are"} over ${L * 100}%.` : "")
      : past
        ? `Past the limit: every lot fails by ${hardPct - L * 100}% of its site, the purple stripe.`
        : `A house shows once its roofs fit within ${hardPct}% of its lot.`;
  slider.setAttribute("aria-valuetext", `${hardPct} percent impermeable on every lot; ` +
    (past ? `every lot is over ${L * 100} percent` : `${int(shown)} of ${int(houses)} houses fit`));
  $("checkSummary").innerHTML = `<b class="check">${int(state.count50wall)}</b> roofs over ${B.building_limit * 100}% <span class="caption">· check</span>`;
  $("checkBody").textContent = `${int(state.count50edge)} to the roof edge; the ${EAVE_M} m eave allowance leaves ${int(state.count50wall)}. ` +
    `The air photo cannot say which is right, so these sites are outlined in amber as "check", never "exceedance".`;
  const share = k => totals.rainM3 > 0 ? totals[k] / totals.rainM3 * 100 : 0;
  $("waterSummary").innerHTML = `${STORM.rainfall_mm} mm storm <span class="caption">· ${Math.round(share("heldM3"))}% soaks in</span>`;
  $("waterTitle").textContent = `${STORM.rainfall_mm} mm storm, every lot as set above`;
  $("barHeld").style.width = `${share("heldM3")}%`;
  $("barSewer").style.width = `${share("sewerM3")}%`;
  $("barSurface").style.width = `${share("surfaceM3")}%`;
  $("waterText").innerHTML =
    `<b>${Math.round(share("heldM3"))}%</b> soaks in · ` +
    (totals.sewerM3 < 1 ? `nothing to the storm sewer`
      : `<b>${roundNice(totals.sewerM3)} m³</b> to the storm sewer, about ${(totals.sewerM3 / STORM.pool_m3).toFixed(0)} Olympic pools`);
  $("waterNote").textContent =
    `${STORM.policy}. R1-1 has no retention rule. Assumes ${Math.round(STORM.runoff * 100)}% runoff and ${STORM.soil_mm} mm of soil storage.`;
  renderLotTotals();
  map.triggerRepaint();
}
slider.addEventListener("input", () => { state.hard = +slider.value / 100; cityUpdate(); });

renderPeek();                                       // the phone's peek row says "Loading…" until the data arrives

// ---- Load ------------------------------------------------------------------------------
map.on("load", async () => {
  let data, walls = null;
  try {
    data = await (await fetch(DATA_FILE)).json();
  } catch (e) {
    fail(`Could not load ${DATA_FILE}. Run python3 buildings.py from the project root to generate the lot data, then open this page through  python3 -m http.server  (see the top of this file).`);
    return;
  }
  const hasRw = data.features.length && data.features.every(f => f.properties.rw !== undefined);
  if (hasRw) state.wallsFrom = "lots.geojson";
  else {
    try { walls = await (await fetch(WALLS_FILE)).json(); state.wallsFrom = WALLS_FILE; }
    catch (e) { console.warn(`${WALLS_FILE} not found; roof areas are used as traced (roof edge).`); }
  }
  // Attach rw and the assessed flag to every feature; both the mesh and the labels read them.
  for (const f of data.features) {
    const p = f.properties;
    p.A = Number(p.A); p.r = Number(p.r || 0);
    p.rw = hasRw ? Number(p.rw) : walls && walls.rw[p.k] !== undefined ? Number(walls.rw[p.k]) : p.r;
    p.rw = Math.min(p.rw, p.r);
    p.assessed = p.sc === 0 && !p.cd && !p.f && p.A >= NOT_A_SITE_M2 ? 1 : 0;
    p.adn = normalise(p.ad);                 // for the address search
  }
  state.lots = data.features;
  state.byKey = new Map(data.features.map(f => [f.properties.k, f]));
  state.assessed = data.features.filter(f => f.properties.assessed).map(f => f.properties);
  state.count50edge = state.assessed.filter(p => p.r > BYLAW.building_limit * p.A + 1e-9).length;
  state.count50wall = state.assessed.filter(p => p.rw > BYLAW.building_limit * p.A + 1e-9).length;

  map.addSource("lots", { type: "geojson", data });
  map.getStyle().layers.filter(l => l["source-layer"] === "building")
     .forEach(l => map.setLayoutProperty(l.id, "visibility", "none"));
  const firstLabel = map.getStyle().layers.find(l => l.type === "symbol")?.id;
  map.addLayer(lotLayer(buildLotMesh(data.features)), firstLabel);
  map.addLayer({ id: "lot-hit-area", type: "fill", source: "lots", paint: { "fill-color": "#000", "fill-opacity": 0.02 } }, firstLabel);
  map.addLayer({ id: "lot-edges", type: "line", source: "lots", minzoom: 15,
    paint: { "line-color": dark ? "#1a1a19" : "#fcfcfb", "line-width": ["interpolate", ["linear"], ["zoom"], 15, 0.3, 18, 1.5] } }, firstLabel);
  // Parks, green: where the water could go. Drawn over the lots because many
  // park parcels are in the lot data (large sites in grey, some zoned R1-1);
  // the check rings and the selection stay on top. MapLibre fetches the file
  // itself; if it is missing the map simply has no parks.
  map.addSource("parks", { type: "geojson", data: PARKS_FILE });
  map.addLayer({ id: "parks", type: "fill", source: "parks",
    paint: { "fill-color": dark ? COLOR.parkDark : COLOR.park, "fill-opacity": dark ? 0.7 : 0.8 } }, firstLabel);
  map.addLayer({ id: "park-labels", type: "symbol", source: "parks", minzoom: 14,
    layout: { "text-field": ["get", "n"], "text-font": ["Noto Sans Bold"], "text-size": 12, "symbol-placement": "point" },
    paint: { "text-color": dark ? "#cfe8cf" : "#1d4d24", "text-halo-color": dark ? "#1a1a19" : "#fcfcfb", "text-halo-width": 1.5 } });
  // Catch basins: where the street's water goes today, a small dot each.
  map.addSource("basins", { type: "geojson", data: BASINS_FILE });
  map.addLayer({ id: "basins", type: "circle", source: "basins", minzoom: BASINS_MIN_ZOOM,
    paint: { "circle-color": dark ? COLOR.basinDark : COLOR.basin,
             "circle-radius": ["interpolate", ["linear"], ["zoom"], 15, 1.5, 19, 4],
             "circle-stroke-color": dark ? "#1a1a19" : "#fcfcfb", "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 15, 0.5, 19, 1.5] } }, firstLabel);
  // Community gardens: a light green dot with a dark green ring, over the parks.
  map.addSource("gardens", { type: "geojson", data: GARDENS_FILE });
  map.addLayer({ id: "gardens", type: "circle", source: "gardens", minzoom: 11,
    paint: { "circle-color": COLOR.garden, "circle-radius": ["interpolate", ["linear"], ["zoom"], 11, 3, 15, 5, 18, 8],
             "circle-stroke-color": COLOR.gardenEdge, "circle-stroke-width": 1.5 } }, firstLabel);
  map.addLayer({ id: "garden-labels", type: "symbol", source: "gardens", minzoom: 16,
    layout: { "text-field": ["get", "n"], "text-font": ["Noto Sans Regular"], "text-size": 11,
              "text-anchor": "top", "text-offset": [0, 0.9], "text-max-width": 10 },
    paint: { "text-color": dark ? "#cfe8cf" : "#1d4d24", "text-halo-color": dark ? "#1a1a19" : "#fcfcfb", "text-halo-width": 1.5 } });
  // The lot you picked: a wide casing in the page's surface colour, drawn
  // under the amber check ring so a lot that is both still shows both; its
  // dashed ink line is added after the check layers, below.
  map.addLayer({ id: "selected-casing", type: "line", source: "lots", filter: ["==", ["get", "k"], ""],
    layout: { "line-join": "round" },
    paint: { "line-color": dark ? "#1a1a19" : "#fcfcfb", "line-width": 9, "line-opacity": 0.95 } }, firstLabel);
  // Roofs over 50% even to the walls: an amber outline, "check".
  const checkFilter = ["all", ["==", ["get", "assessed"], 1], [">", ["get", "rw"], ["*", BYLAW.building_limit, ["get", "A"]]]];
  for (const [id, color, width] of [
    ["check-50-casing", "#17212b", ["interpolate", ["linear"], ["zoom"], 15, 2.5, 18, 6]],
    ["check-50", COLOR.check, ["interpolate", ["linear"], ["zoom"], 15, 1, 18, 3.5]],
  ]) {
    map.addLayer({ id, type: "line", source: "lots", minzoom: 15, filter: checkFilter,
      layout: { "line-join": "round" }, paint: { "line-color": color, "line-width": width } }, firstLabel);
  }
  // Zoomed out, the same sites as amber circles with counts; click a circle to zoom in.
  const checkSites = data.features.filter(f => f.properties.assessed && f.properties.rw > BYLAW.building_limit * f.properties.A + 1e-9);
  map.addSource("check-points", { type: "geojson", cluster: true, clusterRadius: 44, clusterMaxZoom: 15,
    data: { type: "FeatureCollection", features: checkSites.map(f => ({ type: "Feature", properties: { k: f.properties.k },
      geometry: { type: "Point", coordinates: featureCenter(f) } })) } });
  map.addLayer({ id: "check-clusters", type: "circle", source: "check-points", filter: ["has", "point_count"],
    paint: { "circle-color": COLOR.check, "circle-radius": ["step", ["get", "point_count"], 15, 20, 19, 100, 24, 500, 30],
             "circle-stroke-color": "#17212b", "circle-stroke-width": 1.5, "circle-opacity": 0.96 } }, firstLabel);
  map.addLayer({ id: "check-cluster-counts", type: "symbol", source: "check-points", filter: ["has", "point_count"],
    layout: { "text-field": ["get", "point_count_abbreviated"], "text-font": ["Noto Sans Bold"], "text-size": 12, "text-allow-overlap": true },
    paint: { "text-color": "#17212b" } }, firstLabel);
  map.addLayer({ id: "check-single", type: "circle", source: "check-points", filter: ["!", ["has", "point_count"]], maxzoom: 15.5,
    paint: { "circle-color": COLOR.check, "circle-radius": 5, "circle-stroke-color": "#17212b", "circle-stroke-width": 1.5 } }, firstLabel);
  map.on("click", "check-clusters", e => map.easeTo({ center: e.lngLat, zoom: Math.min(map.getZoom() + 2, 18) }));
  map.on("click", "check-single", e => { const f = state.byKey.get(e.features[0].properties.k); if (f) selectLot(f, true); });
  for (const id of ["check-clusters", "check-single"]) {
    map.on("mouseenter", id, () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", id, () => { map.getCanvas().style.cursor = ""; });
  }
  // The dashed ink line of the lot you picked; its casing sits under the check ring, above.
  map.addLayer({ id: "selected", type: "line", source: "lots", filter: ["==", ["get", "k"], ""],
    layout: { "line-join": "round" },
    paint: { "line-color": dark ? "#f0efec" : "#1f1f1d", "line-width": 3, "line-dasharray": [2, 1.5] } }, firstLabel);
  map.addLayer({ id: "labels", type: "symbol", source: "lots", minzoom: 17.5,
    filter: ["==", ["get", "assessed"], 1],
    layout: {
      // two lines, figures in bold: "roofs 38%" over "room 224 m²"
      "text-field": ["format",
        "roofs ", {}, ["concat", ["to-string", ["round", ["*", 100, ["/", ["get", "rw"], ["get", "A"]]]]], "%"], { "text-font": ["literal", ["Noto Sans Bold"]] },
        "\nroom ", {}, ["concat", ["to-string", ["round", ["-", ["*", BYLAW.impermeable_limit, ["get", "A"]], ["get", "rw"]]]], " m²"], { "text-font": ["literal", ["Noto Sans Bold"]] }],
      "text-font": ["Noto Sans Regular"], "text-size": 11, "text-line-height": 1.25, "symbol-placement": "point" },
    paint: { "text-color": dark ? "#f2f0eb" : "#1c1b18", "text-halo-color": dark ? "#1b1a18" : "#fbfaf7", "text-halo-width": 2, "text-halo-blur": 0.5 } });
  map.addLayer({ id: "scope-labels", type: "symbol", source: "lots", minzoom: 16,
    filter: ["any", ["==", ["get", "sc"], 1], ["==", ["get", "cd"], 1], ["==", ["get", "f"], 1]],
    layout: { "text-field": ["case", ["==", ["get", "sc"], 1], "Large site: outside scope", "Check data"],
              "text-font": ["Noto Sans Bold"], "text-size": 11, "symbol-placement": "point" },
    paint: { "text-color": dark ? "#f0efec" : "#1f1f1d", "text-halo-color": dark ? "#1a1a19" : "#fcfcfb", "text-halo-width": 1.5 } });

  map.on("click", "lot-hit-area", e => {
    if (map.queryRenderedFeatures(e.point, { layers: ["check-clusters", "check-single"] }).length) return;
    const f = e.features && e.features[0];
    if (f) selectLot(state.byKey.get(f.properties.k) || f, false);
  });
  map.on("mouseenter", "lot-hit-area", () => { map.getCanvas().style.cursor = "pointer"; });
  map.on("mouseleave", "lot-hit-area", () => { map.getCanvas().style.cursor = ""; });

  loading.remove();
  const pr = $("progress"); if (pr) pr.remove();
  state.ready = true;
  slider.disabled = false;
  const opening = OPEN_ADDRESS ? findAddress(OPEN_ADDRESS) : null;
  if (opening) selectLot(opening, true); else renderLot();
  cityUpdate();

  // Footprints: fetched the first time the map is close enough to show them.
  let footprintsRequested = false;
  const roofsNote = $("roofsNote");
  const loadFootprints = async () => {
    if (footprintsRequested || map.getZoom() < BUILDINGS_MIN_ZOOM) return;
    footprintsRequested = true;
    roofsNote.textContent = " · Roofs…"; roofsNote.hidden = false;
    try {
      const res = await fetch(BUILDINGS_FILE);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      const buildings = await res.json();
      roofShares(buildings.features, state.lots);
      map.addLayer(roofLayer(buildRoofMesh(buildings.features)), "selected-casing");
      roofsNote.hidden = true;
    } catch (e) {
      console.warn(`Could not load ${BUILDINGS_FILE}; roofs are not drawn.`, e);
      roofsNote.textContent = " · Roof outlines not available; the numbers still include them.";
    }
  };
  map.on("zoomend", loadFootprints);
  loadFootprints();
});
</script>
</body>
</html>
