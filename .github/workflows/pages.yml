name: Publish map to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "map/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the data files the page will load
        run: python3 map/check_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: map
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
